   "source": [
    "# 🎬 Remotion Live Panel on a T4 GPU — one click\n",
    "\n",
    "1. Check the top-right says **T4** (if not: Runtime → Change runtime type → **T4 GPU** → Save).\n",
    "2. Press **▶** on the cell below (or **Ctrl + F9** = Run all).\n",
    "3. Wait 3–5 minutes. Open the **Live Panel link** printed at the end.\n",
    "\n",
    "The last two small cells are optional: download your files, and stop everything."
   ]
  },
  {
   "cell_type": "code",
   "metadata": {
    "cellView": "form"
   },
   "execution_count": null,
   "outputs": [],
   "source": [
    "#@title ▶ Run this one cell: setup + Remotion Live Panel (about 3–5 min)\n",
    "SOURCE = \"starter\"  #@param [\"starter\", \"github\", \"google_drive\"]\n",
    "GITHUB_REPO = \"\"  #@param {type:\"string\"}\n",
    "DRIVE_FOLDER = \"my-remotion\"  #@param {type:\"string\"}\n",
    "USE_GPU = True  #@param {type:\"boolean\"}\n",
    "PANEL_PASSWORD = \"\"  #@param {type:\"string\"}\n",
    "#@markdown - **starter** = ready neon background animation · **github** = public repo URL · **google_drive** = `MyDrive/<DRIVE_FOLDER>`\n",
    "#@markdown - At the end the cell prints the **Live Panel link**. Keep this tab open.\n",
    "\n",
    "import time as _t\n",
    "_T0 = _t.time()\n",
    "def step(n, text):\n",
    "    print(f\"\\n[{n}/5] {text}  ({int(_t.time() - _T0)} s)\", flush=True)\n",
    "\n",
    "\n",
    "step(1, \"Checking the GPU\")\n",
    "import subprocess\n",
    "r = subprocess.run(\"nvidia-smi\", shell=True, capture_output=True, text=True)\n",
    "print(\"\\n\".join((r.stdout or r.stderr).splitlines()[:12]))\n",
    "if r.returncode != 0:\n",
    "    print(\"⚠️ No GPU found. Open Runtime → Change runtime type → T4 GPU → Save, then run this cell again.\")\n",
    "else:\n",
    "    print(\"✅ GPU ready.\")\n",
    "\n",
    "step(2, \"Installing Node.js, Chrome libraries and GPU drivers\")\n",
    "import subprocess, os, glob, json\n",
    "\n",
    "def sh(cmd, check=True):\n",
    "    r = subprocess.run(cmd, shell=True, capture_output=True, text=True)\n",
    "    if check and r.returncode != 0:\n",
    "        print(r.stdout[-3000:], r.stderr[-3000:])\n",
    "        raise RuntimeError(\"Command failed: \" + cmd)\n",
    "    return r\n",
    "\n",
    "node = sh(\"node -v\", check=False).stdout.strip()\n",
    "if not node.startswith(\"v22\"):\n",
    "    print(\"Installing Node.js 22…\")\n",
    "    sh(\"curl -fsSL https://deb.nodesource.com/setup_22.x | bash -\")\n",
    "    sh(\"apt-get install -y -qq nodejs\")\n",
    "print(\"Node.js\", sh(\"node -v\").stdout.strip())\n",
    "\n",
    "print(\"Installing Chrome libraries and Vulkan…\")\n",
    "sh(\"apt-get update -qq\")\n",
    "sh(\"DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libvulkan1 vulkan-tools mesa-utils libegl1 \"\n",
    "   \"libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 libxkbcommon-dev libxfixes3 \"\n",
    "   \"libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 zip\")\n",
    "\n",
    "# Colab mounts the NVIDIA driver libraries in /usr/lib64-nvidia. Register them for Vulkan and EGL.\n",
    "libdirs = [d for d in [\"/usr/lib64-nvidia\", \"/usr/lib/x86_64-linux-gnu\"] if os.path.isdir(d)]\n",
    "with open(\"/etc/ld.so.conf.d/zz-colab-nvidia.conf\", \"w\") as f:\n",
    "    f.write(\"\\n\".join(libdirs) + \"\\n\")\n",
    "sh(\"ldconfig\", check=False)\n",
    "\n",
    "def find(name):\n",
    "    for d in libdirs:\n",
    "        hits = glob.glob(os.path.join(d, name + \"*\"))\n",
    "        if hits:\n",
    "            return sorted(hits)[0]\n",
    "    return \"\"\n",
    "\n",
    "glx = find(\"libGLX_nvidia.so\")\n",
    "egl = find(\"libEGL_nvidia.so\")\n",
    "if glx:\n",
    "    os.makedirs(\"/usr/share/vulkan/icd.d\", exist_ok=True)\n",
    "    with open(\"/usr/share/vulkan/icd.d/nvidia_icd.json\", \"w\") as f:\n",
    "        json.dump({\"file_format_version\": \"1.0.0\", \"ICD\": {\"library_path\": glx, \"api_version\": \"1.3.0\"}}, f)\n",
    "if egl:\n",
    "    os.makedirs(\"/usr/share/glvnd/egl_vendor.d\", exist_ok=True)\n",
    "    with open(\"/usr/share/glvnd/egl_vendor.d/10_nvidia.json\", \"w\") as f:\n",
    "        json.dump({\"file_format_version\": \"1.0.0\", \"ICD\": {\"library_path\": egl}}, f)\n",
    "print(\"NVIDIA GLX library:\", glx or \"not found\")\n",
    "print(\"NVIDIA EGL library:\", egl or \"not found\")\n",
    "\n",
    "v = sh(\"vulkaninfo --summary 2>&1\", check=False).stdout\n",
    "names = [l.strip() for l in v.splitlines() if \"deviceName\" in l]\n",
    "print(\"Vulkan devices:\", names or \"none\")\n",
    "if any(\"NVIDIA\" in n or \"Tesla\" in n for n in names):\n",
    "    print(\"✅ Vulkan sees the T4.\")\n",
    "else:\n",
    "    print(\"⚠️ Vulkan does not see the T4. The next step tries other GPU modes; if none work, rendering falls back to CPU.\")\n",
    "\n",
    "step(3, \"Preparing your Remotion project\")\n",
    "import os, shutil, subprocess, json\n",
    "PROJECT = \"/content/my-remotion\"\n",
    "STARTER = {\n",
    "    \"package.json\": '{\\n  \"name\": \"my-remotion\",\\n  \"private\": true,\\n  \"type\": \"module\",\\n  \"scripts\": {\\n    \"studio\": \"remotion studio src/index.ts\",\\n    \"render\": \"remotion render src/index.ts\"\\n  },\\n  \"dependencies\": {\\n    \"@remotion/cli\": \"4.0.538\",\\n    \"react\": \"19.1.0\",\\n    \"react-dom\": \"19.1.0\",\\n    \"remotion\": \"4.0.538\"\\n  },\\n  \"devDependencies\": {\\n    \"@types/react\": \"19.1.8\",\\n    \"typescript\": \"5.8.3\"\\n  }\\n}\\n',\n",
    "    \"tsconfig.json\": '{\\n  \"compilerOptions\": {\\n    \"target\": \"ES2022\",\\n    \"module\": \"ESNext\",\\n    \"moduleResolution\": \"Bundler\",\\n    \"jsx\": \"react-jsx\",\\n    \"strict\": true,\\n    \"skipLibCheck\": true,\\n    \"noEmit\": true\\n  },\\n  \"include\": [\\n    \"src\"\\n  ]\\n}\\n',\n",
    "    \"src/index.ts\": 'import { registerRoot } from \"remotion\";\\nimport { RemotionRoot } from \"./Root\";\\n\\nregisterRoot(RemotionRoot);\\n',\n",
    "    \"src/Root.tsx\": 'import { Composition } from \"remotion\";\\nimport { Main } from \"./Main\";\\n\\n// 10 s seamless loop · 30 fps · Full HD. For vertical use width 1080, height 1920.\\nexport const RemotionRoot: React.FC = () => {\\n  return (\\n    <Composition\\n      id=\"Main\"\\n      component={Main}\\n      durationInFrames={300}\\n      fps={30}\\n      width={1920}\\n      height={1080}\\n    />\\n  );\\n};\\n',\n",
    "    \"src/Main.tsx\": 'import { useMemo } from \"react\";\\nimport { AbsoluteFill, random, useCurrentFrame, useVideoConfig } from \"remotion\";\\n\\nconst TAU = Math.PI * 2;\\n\\n// Soft glowing color blobs (aurora). k = whole cycles per loop, so the loop is seamless.\\nconst BLOBS = [\\n  { color: \"#7c3aed\", size: 950, x: 0.28, y: 0.35, ax: 0.12, ay: 0.1, k: 1, ph: 0 },\\n  { color: \"#06b6d4\", size: 850, x: 0.72, y: 0.62, ax: 0.1, ay: 0.12, k: 1, ph: 2.1 },\\n  { color: \"#ec4899\", size: 700, x: 0.58, y: 0.22, ax: 0.14, ay: 0.08, k: 2, ph: 4.2 },\\n  { color: \"#2563eb\", size: 800, x: 0.18, y: 0.78, ax: 0.08, ay: 0.1, k: 1, ph: 1.3 },\\n];\\n\\nexport const Main: React.FC = () => {\\n  const frame = useCurrentFrame();\\n  const { width, height, durationInFrames } = useVideoConfig();\\n  const u = Math.min(width, height) / 1080;\\n  const p = frame / durationInFrames; // 0 → 1 over the loop\\n\\n  // Floating light particles, placed once with seeded random().\\n  const particles = useMemo(\\n    () =>\\n      new Array(80).fill(0).map((_, i) => ({\\n        x: random(`x${i}`),\\n        y: random(`y${i}`),\\n        r: 2 + random(`r${i}`) * 7,\\n        speed: 1 + Math.floor(random(`s${i}`) * 3), // whole loops → seamless\\n        sway: 10 + random(`w${i}`) * 40,\\n        ph: random(`p${i}`) * TAU,\\n        color: random(`c${i}`) > 0.5 ? \"#a5f3fc\" : \"#f5d0fe\",\\n      })),\\n    []\\n  );\\n\\n  const ring = (size: number, thick: number, turns: number, from: string) => {\\n    const pulse = 1 + 0.04 * Math.sin(TAU * 2 * p);\\n    return (\\n      <div\\n        style={{\\n          position: \"absolute\",\\n          left: width / 2 - (size * u) / 2,\\n          top: height / 2 - (size * u) / 2,\\n          width: size * u,\\n          height: size * u,\\n          borderRadius: \"50%\",\\n          background: `conic-gradient(from ${from}, transparent 0deg, #22d3ee 90deg, #a855f7 180deg, #ec4899 250deg, transparent 360deg)`,\\n          WebkitMaskImage: `radial-gradient(farthest-side, transparent calc(100% - ${thick * u}px), #000 calc(100% - ${(thick - 1) * u}px))`,\\n          maskImage: `radial-gradient(farthest-side, transparent calc(100% - ${thick * u}px), #000 calc(100% - ${(thick - 1) * u}px))`,\\n          transform: `rotate(${turns * 360 * p}deg) scale(${pulse})`,\\n          filter: `drop-shadow(0 0 ${18 * u}px #a855f7) drop-shadow(0 0 ${40 * u}px #22d3ee)`,\\n          opacity: 0.85,\\n        }}\\n      />\\n    );\\n  };\\n\\n  return (\\n    <AbsoluteFill style={{ background: \"radial-gradient(circle at 50% 40%, #111a3a 0%, #070a1a 70%)\", overflow: \"hidden\" }}>\\n      {/* Aurora blobs */}\\n      {BLOBS.map((b, i) => {\\n        const a = TAU * b.k * p + b.ph;\\n        const cx = (b.x + b.ax * Math.sin(a)) * width;\\n        const cy = (b.y + b.ay * Math.cos(a)) * height;\\n        const s = b.size * u * (1 + 0.08 * Math.sin(a * 2));\\n        return (\\n          <div\\n            key={i}\\n            style={{\\n              position: \"absolute\",\\n              left: cx - s / 2,\\n              top: cy - s / 2,\\n              width: s,\\n              height: s,\\n              borderRadius: \"50%\",\\n              background: `radial-gradient(circle, ${b.color} 0%, transparent 65%)`,\\n              filter: `blur(${60 * u}px)`,\\n              mixBlendMode: \"screen\",\\n              opacity: 0.75,\\n            }}\\n          />\\n        );\\n      })}\\n\\n      {/* Counter-rotating glow rings */}\\n      {ring(620, 6, 1, \"0deg\")}\\n      {ring(820, 3, -1, \"120deg\")}\\n\\n      {/* Rising particles (wrap around, never pop) */}\\n      {particles.map((pt, i) => {\\n        const y = (((pt.y - pt.speed * p) % 1) + 1) % 1;\\n        const x = pt.x * width + pt.sway * u * Math.sin(TAU * 2 * p + pt.ph);\\n        const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(TAU * 3 * p + pt.ph));\\n        const r = pt.r * u;\\n        return (\\n          <div\\n            key={`p${i}`}\\n            style={{\\n              position: \"absolute\",\\n              left: x - r,\\n              top: y * (height + 40 * u) - 20 * u - r,\\n              width: r * 2,\\n              height: r * 2,\\n              borderRadius: \"50%\",\\n              background: pt.color,\\n              opacity: twinkle,\\n              boxShadow: `0 0 ${r * 4}px ${pt.color}`,\\n            }}\\n          />\\n        );\\n      })}\\n\\n      {/* Vignette for depth */}\\n      <AbsoluteFill style={{ background: \"radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%)\" }} />\\n    </AbsoluteFill>\\n  );\\n};\\n',\n",
    "}\n",
    "\n",
    "def write_starter(folder):\n",
    "    for rel, text in STARTER.items():\n",
    "        p = os.path.join(folder, rel)\n",
    "        os.makedirs(os.path.dirname(p), exist_ok=True)\n",
    "        if not os.path.exists(p):\n",
    "            with open(p, \"w\") as f:\n",
    "                f.write(text)\n",
    "\n",
    "def copy_project(src):\n",
    "    shutil.copytree(src, PROJECT, dirs_exist_ok=True,\n",
    "                    ignore=shutil.ignore_patterns(\"node_modules\", \".git\", \".cache\"))\n",
    "\n",
    "if os.path.exists(PROJECT) and SOURCE != \"starter\":\n",
    "    shutil.rmtree(PROJECT, ignore_errors=True)\n",
    "os.makedirs(PROJECT, exist_ok=True)\n",
    "\n",
    "if SOURCE == \"github\":\n",
    "    if not GITHUB_REPO.strip():\n",
    "        raise ValueError(\"Paste your public GitHub repo URL in GITHUB_REPO.\")\n",
    "    shutil.rmtree(\"/content/repo\", ignore_errors=True)\n",
    "    r = subprocess.run([\"git\", \"clone\", \"--depth\", \"1\", GITHUB_REPO.strip(), \"/content/repo\"], capture_output=True, text=True)\n",
    "    if r.returncode != 0:\n",
    "        raise RuntimeError(r.stderr)\n",
    "    src = \"/content/repo/my-remotion\" if os.path.isdir(\"/content/repo/my-remotion\") else \"/content/repo\"\n",
    "    copy_project(src)\n",
    "elif SOURCE == \"google_drive\":\n",
    "    from google.colab import drive\n",
    "    drive.mount(\"/content/drive\")\n",
    "    DRIVE_PATH = os.path.join(\"/content/drive/MyDrive\", DRIVE_FOLDER.strip(\"/\"))\n",
    "    os.makedirs(DRIVE_PATH, exist_ok=True)\n",
    "    write_starter(DRIVE_PATH)\n",
    "    copy_project(DRIVE_PATH)\n",
    "    print(\"Drive folder:\", DRIVE_PATH)\n",
    "\n",
    "write_starter(PROJECT)  # fills in only missing files\n",
    "pkg = json.load(open(os.path.join(PROJECT, \"package.json\")))\n",
    "deps = {**pkg.get(\"dependencies\", {}), **pkg.get(\"devDependencies\", {})}\n",
    "if \"remotion\" not in deps:\n",
    "    raise RuntimeError(\"package.json has no 'remotion' dependency. Is this a Remotion project?\")\n",
    "\n",
    "print(\"Installing npm packages (about 1 min)…\")\n",
    "r = subprocess.run(\"npm install --no-audit --no-fund\", shell=True, cwd=PROJECT, capture_output=True, text=True)\n",
    "print(r.stdout[-1500:], r.stderr[-1500:])\n",
    "if r.returncode != 0:\n",
    "    raise RuntimeError(\"npm install failed\")\n",
    "print(\"Downloading Chrome for GPU rendering and Chrome Headless Shell for CPU rendering…\")\n",
    "for mode in [\"chrome-for-testing\", \"headless-shell\"]:\n",
    "    r = subprocess.run(f\"npx remotion browser ensure --chrome-mode={mode}\", shell=True, cwd=PROJECT, capture_output=True, text=True)\n",
    "    print(mode, \"✅\" if r.returncode == 0 else \"⚠️ \" + r.stderr[-800:])\n",
    "print(\"✅ Project ready:\", sorted(os.listdir(os.path.join(PROJECT, \"src\"))))\n",
    "\n",
    "step(4, \"Testing whether Chrome can use the GPU\")\n",
    "import subprocess, re\n",
    "PROJECT = \"/content/my-remotion\"\n",
    "ANSI = re.compile(r\"\\x1b\\[[0-9;]*m\")\n",
    "GPU_GL = \"\"\n",
    "for gl in [\"vulkan\", \"angle-egl\", \"egl\", \"angle\"]:\n",
    "    r = subprocess.run(f\"npx remotion gpu --chrome-mode=chrome-for-testing --gl={gl}\", shell=True,\n",
    "                       cwd=PROJECT, capture_output=True, text=True, timeout=180)\n",
    "    out = ANSI.sub(\"\", r.stdout + r.stderr)\n",
    "    lines = {l.split(\":\")[0].strip(): l.split(\":\", 1)[1].strip() for l in out.splitlines() if \":\" in l}\n",
    "    webgl, canvas = lines.get(\"WebGL\", \"?\"), lines.get(\"Canvas\", \"?\")\n",
    "    print(f\"--gl={gl:10s} WebGL: {webgl} | Canvas: {canvas}\")\n",
    "    if \"Hardware accelerated\" in webgl and \"Hardware accelerated\" in canvas:\n",
    "        GPU_GL = gl\n",
    "        break\n",
    "open(\"/content/remotion_gl.txt\", \"w\").write(GPU_GL)\n",
    "if GPU_GL:\n",
    "    print(f\"\\n✅ GPU works in Chrome with --gl={GPU_GL}. Renders will use the T4.\")\n",
    "else:\n",
    "    print(\"\\n⚠️ Chrome could not use the GPU here. The panel still works, but renders on the CPU (like GitHub).\")\n",
    "\n",
    "step(5, \"Starting Studio, Live Panel and the public link\")\n",
    "import os, subprocess, time, re, hashlib, urllib.request\n",
    "PROJECT = \"/content/my-remotion\"\n",
    "PANEL_DIR = \"/content/panel\"\n",
    "os.makedirs(PANEL_DIR, exist_ok=True)\n",
    "open(f\"{PANEL_DIR}/server.mjs\", \"w\").write('// Remotion Live Panel: editor + Studio preview + render, behind one port.\\nimport http from \\'node:http\\';\\nimport net from \\'node:net\\';\\nimport fs from \\'node:fs\\';\\nimport fsp from \\'node:fs/promises\\';\\nimport path from \\'node:path\\';\\nimport os from \\'node:os\\';\\nimport crypto from \\'node:crypto\\';\\nimport { spawn } from \\'node:child_process\\';\\nimport { createRequire } from \\'node:module\\';\\nimport { fileURLToPath } from \\'node:url\\';\\n\\nconst HERE = path.dirname(fileURLToPath(import.meta.url));\\nconst PROJECT = path.resolve(process.env.PROJECT_DIR || process.cwd());\\nconst SRC = path.join(PROJECT, \\'src\\');\\nconst OUT = path.join(PROJECT, \\'out\\');\\nconst PORT = Number(process.env.PANEL_PORT || 3000);\\nconst STUDIO_PORT = Number(process.env.STUDIO_PORT || 3001);\\nconst SESSION_END = Number(process.env.SESSION_END || 0);\\nconst PASSWORD = process.env.PANEL_PASSWORD || \\'\\';\\nconst GH_TOKEN = process.env.GH_TOKEN || \\'\\';\\nconst REPO = process.env.GITHUB_REPOSITORY || \\'\\';\\nconst REF = process.env.GITHUB_REF_NAME || \\'\\';\\nconst WORKSPACE = process.env.GITHUB_WORKSPACE || path.dirname(PROJECT);\\nconst GL = process.env.RENDER_GL || \\'\\';\\nconst CHROME_MODE = process.env.CHROME_MODE || \\'\\';\\nconst BROWSER = () => ({ ...(GL ? { chromiumOptions: { gl: GL } } : {}), ...(CHROME_MODE ? { chromeMode: CHROME_MODE } : {}) });\\nconst SESSION_TOKEN = crypto.randomBytes(32).toString(\\'hex\\');\\nconst PAGE = fs.readFileSync(path.join(HERE, \\'panel.html\\'), \\'utf8\\');\\n\\nconst req = createRequire(path.join(PROJECT, \\'package.json\\'));\\nlet bundler = null, renderer = null;\\nfunction loadRemotion() {\\n  if (!bundler) bundler = req(\\'@remotion/bundler\\');\\n  if (!renderer) renderer = req(\\'@remotion/renderer\\');\\n}\\n\\n// ---------- helpers ----------\\nfunction send(res, code, body, type = \\'application/json; charset=utf-8\\', extra = {}) {\\n  const data = typeof body === \\'string\\' || Buffer.isBuffer(body) ? body : JSON.stringify(body);\\n  res.writeHead(code, { \\'content-type\\': type, \\'cache-control\\': \\'no-store\\', ...extra });\\n  res.end(data);\\n}\\nfunction readBody(r, limit = 2 * 1024 * 1024) {\\n  return new Promise((resolve, reject) => {\\n    const chunks = []; let n = 0;\\n    r.on(\\'data\\', c => { n += c.length; if (n > limit) { reject(new Error(\\'Body too large\\')); r.destroy(); } else chunks.push(c); });\\n    r.on(\\'end\\', () => resolve(Buffer.concat(chunks).toString(\\'utf8\\')));\\n    r.on(\\'error\\', reject);\\n  });\\n}\\nfunction cookies(r) {\\n  const o = {};\\n  (r.headers.cookie || \\'\\').split(\\';\\').forEach(p => { const i = p.indexOf(\\'=\\'); if (i > 0) o[p.slice(0, i).trim()] = decodeURIComponent(p.slice(i + 1).trim()); });\\n  return o;\\n}\\nfunction authed(r) {\\n  if (!PASSWORD) return true;\\n  const c = cookies(r).rpanel || \\'\\';\\n  return c.length === SESSION_TOKEN.length && crypto.timingSafeEqual(Buffer.from(c), Buffer.from(SESSION_TOKEN));\\n}\\nfunction safeSrcPath(rel) {\\n  if (typeof rel !== \\'string\\' || !/^[A-Za-z0-9_\\\\-./]+$/.test(rel) || rel.includes(\\'..\\')) return null;\\n  const abs = path.resolve(PROJECT, rel);\\n  if (!abs.startsWith(SRC + path.sep)) return null;\\n  if (!/\\\\.(tsx|ts|jsx|js|css|json)$/.test(abs)) return null;\\n  return abs;\\n}\\nasync function walk(dir, base = dir) {\\n  let out = [];\\n  for (const e of await fsp.readdir(dir, { withFileTypes: true }).catch(() => [])) {\\n    if (e.name === \\'node_modules\\' || e.name.startsWith(\\'.\\')) continue;\\n    const p = path.join(dir, e.name);\\n    if (e.isDirectory()) out = out.concat(await walk(p, base));\\n    else out.push(p);\\n  }\\n  return out;\\n}\\nfunction run(cmd, args, opts = {}) {\\n  return new Promise(resolve => {\\n    const p = spawn(cmd, args, { cwd: opts.cwd || PROJECT, env: { ...process.env, ...(opts.env || {}) } });\\n    let out = \\'\\';\\n    const t = setTimeout(() => { out += \\'\\\\n[timed out]\\'; p.kill(\\'SIGKILL\\'); }, opts.timeout || 180000);\\n    p.stdout.on(\\'data\\', d => { out += d; }); p.stderr.on(\\'data\\', d => { out += d; });\\n    p.on(\\'close\\', code => { clearTimeout(t); resolve({ code, out }); });\\n    p.on(\\'error\\', e => { clearTimeout(t); resolve({ code: -1, out: String(e) }); });\\n  });\\n}\\nconst redact = s => (GH_TOKEN ? s.split(GH_TOKEN).join(\\'***\\') : s);\\n\\n// ---------- bundle cache + jobs ----------\\nlet cache = { key: \\'\\', serveUrl: \\'\\' };\\nasync function srcKey() {\\n  const files = (await walk(SRC)).concat([path.join(PROJECT, \\'package.json\\')]);\\n  const h = crypto.createHash(\\'sha1\\');\\n  for (const f of files.sort()) { const s = await fsp.stat(f).catch(() => null); if (s) h.update(f + s.mtimeMs + \\':\\' + s.size); }\\n  return h.digest(\\'hex\\');\\n}\\nasync function getBundle(onProgress) {\\n  loadRemotion();\\n  const key = await srcKey();\\n  if (cache.key === key && fs.existsSync(cache.serveUrl)) return cache.serveUrl;\\n  const serveUrl = await bundler.bundle({ entryPoint: path.join(SRC, \\'index.ts\\'), onProgress: p => onProgress && onProgress(p) });\\n  const old = cache.serveUrl;\\n  cache = { key, serveUrl };\\n  if (old && old !== serveUrl) fsp.rm(old, { recursive: true, force: true }).catch(() => {});\\n  return serveUrl;\\n}\\nlet job = { status: \\'idle\\' };\\nlet cancel = null;\\nconst busy = () => [\\'bundling\\', \\'preparing\\', \\'rendering\\'].includes(job.status);\\nconst stamp = () => new Date().toISOString().replace(/[-:T]/g, \\'\\').slice(4, 14);\\n\\nasync function startRender(o) {\\n  loadRemotion();\\n  const id = String(o.composition || \\'Main\\').replace(/[^A-Za-z0-9_-]/g, \\'\\') || \\'Main\\';\\n  const crf = { best: 16, high: 20, small: 26 }[o.quality] || 20;\\n  const scale = [0.25, 0.5, 1, 2].includes(Number(o.scale)) ? Number(o.scale) : 1;\\n  const name = `${id}-${stamp()}${o.test ? \\'-test\\' : \\'\\'}${scale !== 1 ? \\'-x\\' + scale : \\'\\'}.mp4`;\\n  job = { status: \\'bundling\\', progress: 0, stage: \\'Bundling code…\\', started: Date.now(), file: name, composition: id };\\n  try {\\n    const serveUrl = await getBundle(p => { job.stage = `Bundling code… ${Math.round(p)}%`; });\\n    job.status = \\'preparing\\'; job.stage = \\'Opening composition…\\';\\n    const composition = await renderer.selectComposition({ serveUrl, id, inputProps: {}, ...BROWSER() });\\n    const last = composition.durationInFrames - 1;\\n    const frameRange = o.test ? [0, Math.min(last, composition.fps * 3 - 1)] : null;\\n    job.total = frameRange ? frameRange[1] + 1 : composition.durationInFrames;\\n    job.meta = `${composition.width * scale} × ${composition.height * scale} · ${composition.fps} fps · ${job.total} frames${GL ? \\' · GPU \\' + GL : \\'\\'}`;\\n    await fsp.mkdir(OUT, { recursive: true });\\n    const c = renderer.makeCancelSignal(); cancel = c.cancel;\\n    job.status = \\'rendering\\'; job.stage = \\'Rendering frames…\\';\\n    await renderer.renderMedia({\\n      composition, serveUrl, codec: \\'h264\\', crf, scale, frameRange,\\n      outputLocation: path.join(OUT, name), inputProps: {}, cancelSignal: c.cancelSignal, ...BROWSER(),\\n      onProgress: p => {\\n        job.progress = p.progress;\\n        job.stage = p.stitchStage === \\'muxing\\' ? \\'Finishing MP4…\\' : `Frames ${p.renderedFrames}/${job.total} · encoded ${p.encodedFrames}`;\\n      },\\n    });\\n    job = { ...job, status: \\'done\\', progress: 1, stage: \\'Done\\', seconds: Math.round((Date.now() - job.started) / 1000) };\\n  } catch (e) {\\n    job = { ...job, status: job.status === \\'cancelled\\' ? \\'cancelled\\' : \\'error\\', error: String(e && e.stack || e).slice(0, 4000) };\\n    fsp.rm(path.join(OUT, name), { force: true }).catch(() => {});\\n  } finally { cancel = null; }\\n}\\n\\n// ---------- API ----------\\nasync function api(r, res, url) {\\n  const p = url.pathname.replace(\\'/__panel/api/\\', \\'\\');\\n  if (p === \\'info\\') return send(res, 200, { sessionEnd: SESSION_END, github: !!(GH_TOKEN && REPO), repo: REPO, ref: REF, password: !!PASSWORD, gpu: GL ? GL + (CHROME_MODE ? \\' · \\' + CHROME_MODE : \\'\\') : \\'\\' });\\n  if (p === \\'files\\') {\\n    const files = (await walk(SRC)).map(f => path.relative(PROJECT, f).split(path.sep).join(\\'/\\')).filter(f => safeSrcPath(f));\\n    return send(res, 200, { files });\\n  }\\n  if (p === \\'file\\') {\\n    const abs = safeSrcPath(url.searchParams.get(\\'path\\'));\\n    if (!abs) return send(res, 400, { error: \\'Invalid file path. Use src/Name.tsx\\' });\\n    if (r.method === \\'GET\\') {\\n      const t = await fsp.readFile(abs, \\'utf8\\').catch(() => null);\\n      return t === null ? send(res, 404, { error: \\'Not found\\' }) : send(res, 200, { content: t });\\n    }\\n    if (r.method === \\'PUT\\') {\\n      const body = await readBody(r);\\n      await fsp.mkdir(path.dirname(abs), { recursive: true });\\n      await fsp.writeFile(abs, body.replace(/\\\\r\\\\n/g, \\'\\\\n\\'));\\n      return send(res, 200, { ok: true });\\n    }\\n  }\\n  if (p === \\'check\\' && r.method === \\'POST\\') {\\n    const tsc = path.join(PROJECT, \\'node_modules\\', \\'.bin\\', \\'tsc\\');\\n    if (!fs.existsSync(tsc)) return send(res, 200, { ok: false, out: \\'TypeScript is not installed in this project (add \"typescript\" to devDependencies).\\' });\\n    const x = await run(tsc, [\\'--noEmit\\', \\'-p\\', \\'.\\'], { timeout: 180000 });\\n    return send(res, 200, { ok: x.code === 0, out: x.out.trim() || \\'No TypeScript errors.\\' });\\n  }\\n  if (p === \\'render\\' && r.method === \\'POST\\') {\\n    if (busy()) return send(res, 409, { error: \\'A render is already running.\\' });\\n    const o = JSON.parse((await readBody(r)) || \\'{}\\');\\n    startRender(o);\\n    return send(res, 202, { ok: true });\\n  }\\n  if (p === \\'still\\' && r.method === \\'POST\\') {\\n    if (busy()) return send(res, 409, { error: \\'Wait for the current render to finish.\\' });\\n    const o = JSON.parse((await readBody(r)) || \\'{}\\');\\n    loadRemotion();\\n    const id = String(o.composition || \\'Main\\').replace(/[^A-Za-z0-9_-]/g, \\'\\') || \\'Main\\';\\n    job = { status: \\'bundling\\', progress: 0, stage: \\'Bundling for snapshot…\\', started: Date.now() };\\n    try {\\n      const serveUrl = await getBundle(pr => { job.stage = `Bundling code… ${Math.round(pr)}%`; });\\n      job = { status: \\'preparing\\', stage: \\'Rendering snapshot…\\', progress: 0 };\\n      const composition = await renderer.selectComposition({ serveUrl, id, inputProps: {}, ...BROWSER() });\\n      const frame = Math.max(0, Math.min(composition.durationInFrames - 1, Math.round(Number(o.frame) || 0)));\\n      await fsp.mkdir(OUT, { recursive: true });\\n      const name = `still-${id}-f${frame}-${stamp()}.png`;\\n      await renderer.renderStill({ composition, serveUrl, frame, output: path.join(OUT, name), inputProps: {}, ...BROWSER() });\\n      job = { status: \\'idle\\' };\\n      return send(res, 200, { ok: true, file: name, frame });\\n    } catch (e) {\\n      job = { status: \\'idle\\' };\\n      return send(res, 200, { ok: false, error: String(e && e.stack || e).slice(0, 4000) });\\n    }\\n  }\\n  if (p === \\'job\\') return send(res, 200, job);\\n  if (p === \\'cancel\\' && r.method === \\'POST\\') { if (cancel) { job.status = \\'cancelled\\'; cancel(); } return send(res, 200, { ok: true }); }\\n  if (p === \\'outputs\\') {\\n    const list = [];\\n    for (const f of await fsp.readdir(OUT).catch(() => [])) {\\n      if (!/\\\\.(mp4|mov|webm|gif|png|jpe?g|mp3|wav)$/i.test(f)) continue;\\n      const s = await fsp.stat(path.join(OUT, f)).catch(() => null);\\n      if (s && s.isFile()) list.push({ name: f, size: s.size, time: s.mtimeMs });\\n    }\\n    list.sort((a, b) => b.time - a.time);\\n    return send(res, 200, { files: list });\\n  }\\n  if (p === \\'delete\\' && r.method === \\'POST\\') {\\n    const name = path.basename(JSON.parse((await readBody(r)) || \\'{}\\').name || \\'\\');\\n    if (!name || (busy() && name === job.file)) return send(res, 400, { error: \\'Cannot delete this file now.\\' });\\n    await fsp.rm(path.join(OUT, name), { force: true });\\n    return send(res, 200, { ok: true });\\n  }\\n  if (p === \\'commit\\' && r.method === \\'POST\\') {\\n    if (!GH_TOKEN || !REPO || !REF) return send(res, 200, { ok: false, out: \\'GitHub saving is not available in this session.\\' });\\n    const o = JSON.parse((await readBody(r)) || \\'{}\\');\\n    const msg = String(o.message || \\'\\').trim().slice(0, 200) || \\'Update animation from Remotion Live Panel\\';\\n    const rel = path.relative(WORKSPACE, PROJECT) || \\'.\\';\\n    const gi = path.join(PROJECT, \\'.gitignore\\');\\n    if (!fs.existsSync(gi)) await fsp.writeFile(gi, \\'node_modules/\\\\nout/\\\\n.cache/\\\\n\\');\\n    const remote = `https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git`;\\n    const g = (...a) => run(\\'git\\', a, { cwd: WORKSPACE, timeout: 120000 });\\n    let log = \\'\\';\\n    const step = async (...a) => { const x = await g(...a); log += `$ git ${a[0]} …\\\\n${x.out}`; return x; };\\n    await g(\\'config\\', \\'user.name\\', \\'Remotion Live Panel\\');\\n    await g(\\'config\\', \\'user.email\\', \\'41898282+github-actions[bot]@users.noreply.github.com\\');\\n    await step(\\'add\\', \\'--\\', `${rel}/src`, `${rel}/package.json`, `${rel}/tsconfig.json`, `${rel}/.gitignore`);\\n    const diff = await g(\\'diff\\', \\'--cached\\', \\'--quiet\\');\\n    if (diff.code === 0) return send(res, 200, { ok: true, out: \\'Nothing new to save. GitHub already has this code.\\' });\\n    const c = await step(\\'commit\\', \\'-m\\', msg);\\n    if (c.code !== 0) return send(res, 200, { ok: false, out: redact(log) });\\n    let push = await step(\\'push\\', remote, `HEAD:refs/heads/${REF}`);\\n    if (push.code !== 0) {\\n      await step(\\'pull\\', \\'--rebase\\', remote, REF);\\n      push = await step(\\'push\\', remote, `HEAD:refs/heads/${REF}`);\\n    }\\n    return send(res, 200, { ok: push.code === 0, out: redact(log) });\\n  }\\n  return send(res, 404, { error: \\'Unknown API\\' });\\n}\\n\\nfunction serveOut(r, res, url) {\\n  const name = path.basename(decodeURIComponent(url.pathname.replace(\\'/__panel/out/\\', \\'\\')));\\n  const abs = path.join(OUT, name);\\n  fs.stat(abs, (err, s) => {\\n    if (err || !s.isFile()) return send(res, 404, \\'Not found\\', \\'text/plain\\');\\n    const ext = path.extname(name).toLowerCase();\\n    const type = { \\'.mp4\\': \\'video/mp4\\', \\'.mov\\': \\'video/quicktime\\', \\'.webm\\': \\'video/webm\\', \\'.gif\\': \\'image/gif\\', \\'.png\\': \\'image/png\\', \\'.jpg\\': \\'image/jpeg\\', \\'.jpeg\\': \\'image/jpeg\\', \\'.mp3\\': \\'audio/mpeg\\', \\'.wav\\': \\'audio/wav\\' }[ext] || \\'application/octet-stream\\';\\n    const headers = { \\'content-type\\': type, \\'accept-ranges\\': \\'bytes\\', \\'cache-control\\': \\'no-store\\' };\\n    if (url.searchParams.get(\\'download\\')) headers[\\'content-disposition\\'] = `attachment; filename=\"${name}\"`;\\n    const m = /bytes=(\\\\d*)-(\\\\d*)/.exec(r.headers.range || \\'\\');\\n    if (m) {\\n      const start = m[1] ? Number(m[1]) : 0, end = m[2] ? Math.min(Number(m[2]), s.size - 1) : s.size - 1;\\n      if (start > end || start >= s.size) { res.writeHead(416, { \\'content-range\\': `bytes */${s.size}` }); return res.end(); }\\n      res.writeHead(206, { ...headers, \\'content-range\\': `bytes ${start}-${end}/${s.size}`, \\'content-length\\': end - start + 1 });\\n      return fs.createReadStream(abs, { start, end }).pipe(res);\\n    }\\n    res.writeHead(200, { ...headers, \\'content-length\\': s.size });\\n    fs.createReadStream(abs).pipe(res);\\n  });\\n}\\n\\n// ---------- Studio proxy ----------\\nfunction proxy(r, res) {\\n  const p = http.request({ host: \\'127.0.0.1\\', port: STUDIO_PORT, method: r.method, path: r.url, headers: r.headers }, pr => {\\n    res.writeHead(pr.statusCode || 502, pr.headers);\\n    pr.pipe(res);\\n  });\\n  p.on(\\'error\\', () => { if (!res.headersSent) send(res, 502, \\'<p style=\"font:16px sans-serif;padding:24px\">Remotion Studio is starting… reload in a few seconds.</p>\\', \\'text/html; charset=utf-8\\'); else res.end(); });\\n  r.pipe(p);\\n}\\n\\nconst LOGIN = err => `<!doctype html><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Remotion Live Panel</title><body style=\"margin:0;display:grid;place-items:center;height:100vh;background:#0b1020;color:#e2e8f0;font:16px system-ui\"><form method=\"post\" action=\"/__panel/login\" style=\"background:#121a2e;padding:28px;border-radius:14px;width:300px;display:grid;gap:12px\"><b style=\"font-size:18px\">Remotion Live Panel</b>${err ? \\'<span style=\"color:#f87171\">Wrong password</span>\\' : \\'\\'}<input name=\"password\" type=\"password\" placeholder=\"Panel password\" autofocus style=\"padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1020;color:#fff\"><button style=\"padding:10px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:600\">Open panel</button></form>`;\\n\\nconst server = http.createServer(async (r, res) => {\\n  try {\\n    const url = new URL(r.url, \\'http://x\\');\\n    if (url.pathname === \\'/__panel/health\\') return send(res, 200, \\'ok\\', \\'text/plain\\');\\n    if (url.pathname === \\'/__panel/login\\') {\\n      if (r.method === \\'POST\\') {\\n        const pw = new URLSearchParams(await readBody(r, 10000)).get(\\'password\\') || \\'\\';\\n        const a = crypto.createHash(\\'sha256\\').update(pw).digest(), b = crypto.createHash(\\'sha256\\').update(PASSWORD).digest();\\n        if (PASSWORD && crypto.timingSafeEqual(a, b)) return send(res, 302, \\'\\', \\'text/plain\\', { location: \\'/__panel/\\', \\'set-cookie\\': `rpanel=${SESSION_TOKEN}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400` });\\n        return send(res, 401, LOGIN(true), \\'text/html; charset=utf-8\\');\\n      }\\n      return send(res, 200, LOGIN(false), \\'text/html; charset=utf-8\\');\\n    }\\n    if (!authed(r)) {\\n      if ((r.headers[\\'sec-fetch-dest\\'] || \\'document\\') === \\'document\\' && r.method === \\'GET\\') return send(res, 302, \\'\\', \\'text/plain\\', { location: \\'/__panel/login\\' });\\n      return send(res, 401, { error: \\'Login required\\' });\\n    }\\n    if (url.pathname === \\'/__panel\\' || url.pathname === \\'/__panel/\\') return send(res, 200, PAGE, \\'text/html; charset=utf-8\\');\\n    if (url.pathname.startsWith(\\'/__panel/api/\\')) return await api(r, res, url);\\n    if (url.pathname.startsWith(\\'/__panel/out/\\')) return serveOut(r, res, url);\\n    // A normal page visit to \"/\" opens the panel; the iframe (and /?studio) gets Remotion Studio.\\n    if (r.url === \\'/\\' && r.method === \\'GET\\' && (r.headers[\\'sec-fetch-dest\\'] || \\'document\\') === \\'document\\') return send(res, 302, \\'\\', \\'text/plain\\', { location: \\'/__panel/\\' });\\n    return proxy(r, res);\\n  } catch (e) {\\n    if (!res.headersSent) send(res, 500, { error: String(e && e.message || e) }); else res.end();\\n  }\\n});\\nserver.on(\\'upgrade\\', (r, sock, head) => {\\n  if (!authed(r)) { sock.end(\\'HTTP/1.1 401 Unauthorized\\\\r\\\\n\\\\r\\\\n\\'); return; }\\n  const up = net.connect(STUDIO_PORT, \\'127.0.0.1\\', () => {\\n    let h = `${r.method} ${r.url} HTTP/${r.httpVersion}\\\\r\\\\n`;\\n    for (let i = 0; i < r.rawHeaders.length; i += 2) h += `${r.rawHeaders[i]}: ${r.rawHeaders[i + 1]}\\\\r\\\\n`;\\n    up.write(h + \\'\\\\r\\\\n\\'); if (head && head.length) up.write(head);\\n    sock.pipe(up).pipe(sock);\\n  });\\n  up.on(\\'error\\', () => sock.destroy()); sock.on(\\'error\\', () => up.destroy());\\n});\\nserver.requestTimeout = 0;\\nserver.headersTimeout = 60000;\\nserver.listen(PORT, \\'127.0.0.1\\', () => console.log(`Remotion Live Panel on http://127.0.0.1:${PORT}/__panel/ (Studio proxied from ${STUDIO_PORT}) cpus=${os.cpus().length}`));\\n')\n",
    "open(f\"{PANEL_DIR}/panel.html\", \"w\").write('<!doctype html>\\n<html lang=\"en\">\\n<head>\\n<meta charset=\"utf-8\">\\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\\n<title>Remotion Live Panel</title>\\n<style>\\n:root{--bg:#0b1020;--card:#121a2e;--line:#243047;--text:#e2e8f0;--muted:#94a3b8;--acc:#6366f1;--ok:#22c55e;--bad:#f87171;--warn:#fbbf24}\\n*{box-sizing:border-box}\\nhtml,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}\\nbutton,select,input,textarea{font:inherit;color:inherit}\\nbutton{background:#1e293b;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}\\nbutton:hover{border-color:#475569}\\na{color:inherit;text-decoration:none}\\nbutton.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}\\nbutton.danger{color:var(--bad)}\\nbutton:disabled{opacity:.5;cursor:not-allowed}\\nselect,input[type=text],input[type=number]{background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:7px 9px}\\nheader{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0e1528}\\nheader b{font-size:16px;margin-right:auto}\\nheader .pill{color:var(--muted);font-size:13px}\\nmain{display:grid;grid-template-columns:minmax(360px,44%) 1fr;height:calc(100vh - 52px)}\\n.col{display:flex;flex-direction:column;min-height:0;min-width:0}\\n.left{border-right:1px solid var(--line)}\\n.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}\\n.bar .grow{flex:1}\\n#editor{flex:1;min-height:200px;position:relative}\\n#editor textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;padding:12px;background:#0b1020;color:#dbeafe;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;outline:none}\\n#console{height:150px;overflow:auto;margin:0;padding:10px;border-top:1px solid var(--line);background:#070b16;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:var(--muted)}\\n#console.ok{color:#86efac}#console.bad{color:#fca5a5}\\n#studioWrap{flex:1;min-height:280px;position:relative;background:#000}\\n#studio{position:absolute;inset:0;width:100%;height:100%;border:0}\\n.render{max-height:46%;overflow:auto;border-top:1px solid var(--line);padding:12px;display:grid;gap:12px;background:var(--card)}\\n.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\\n.row label{color:var(--muted);font-size:12px;display:grid;gap:3px}\\n.progress{height:10px;background:#1e293b;border-radius:99px;overflow:hidden}\\n.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#22d3ee);transition:width .3s}\\n#stage{color:var(--muted);font-size:13px}\\n#renderErr{color:#fca5a5;white-space:pre-wrap;font:12px ui-monospace,monospace;margin:0;max-height:160px;overflow:auto}\\n.outputs{display:grid;gap:6px}\\n.out{display:flex;gap:8px;align-items:center;background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:6px 8px}\\n.out span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\\n.out small{color:var(--muted)}\\n.muted{color:var(--muted)}\\nh3{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}\\ndialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(860px,94vw);padding:0}\\ndialog::backdrop{background:rgba(0,0,0,.6)}\\n.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}\\n.db{padding:14px 16px;display:grid;gap:10px}\\n.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}\\ndialog textarea{width:100%;height:46vh;background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:10px;color:#dbeafe;font:12px/1.5 ui-monospace,monospace}\\ndialog