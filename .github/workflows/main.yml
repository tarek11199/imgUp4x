name: Remotion Studio and render
run-name: Remotion ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: studio = Live Panel (edit code + Studio preview + render in one page); render = make the MP4 directly
        type: choice
        required: true
        default: studio
        options:
          - studio
          - render
      minutes:
        description: Studio session length after startup (studio mode only)
        type: choice
        required: true
        default: '330'
        options:
          - '330'
          - '60'
          - '30'
      composition:
        description: Composition ID to render (render mode only)
        type: string
        required: true
        default: Main

permissions:
  contents: read

concurrency:
  group: remotion-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  remotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROJECT_DIR: ${{ github.workspace }}/my-remotion

    steps:
      - name: Check out your project repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create starter project if my-remotion is missing
        run: |
          set -euo pipefail
          if [[ -f "$PROJECT_DIR/package.json" ]]; then
            echo 'Using your my-remotion project from the repository.'
            exit 0
          fi
          echo '::notice::No my-remotion folder found. Creating a starter project. Commit it to your repo to keep your code.'
          mkdir -p "$PROJECT_DIR/src"
          cat > "$PROJECT_DIR/package.json" <<'EOF'
          {
            "name": "my-remotion",
            "private": true,
            "type": "module",
            "scripts": {
              "studio": "remotion studio src/index.ts",
              "render": "remotion render src/index.ts"
            },
            "dependencies": {
              "@remotion/cli": "4.0.538",
              "react": "19.1.0",
              "react-dom": "19.1.0",
              "remotion": "4.0.538"
            },
            "devDependencies": {
              "@types/react": "19.1.8",
              "typescript": "5.8.3"
            }
          }
          EOF
          cat > "$PROJECT_DIR/tsconfig.json" <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-jsx",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true
            },
            "include": ["src"]
          }
          EOF
          cat > "$PROJECT_DIR/src/index.ts" <<'EOF'
          import { registerRoot } from "remotion";
          import { RemotionRoot } from "./Root";

          registerRoot(RemotionRoot);
          EOF
          cat > "$PROJECT_DIR/src/Root.tsx" <<'EOF'
          import { Composition } from "remotion";
          import { Main } from "./Main";

          // Change size, fps and length here. Example vertical 3K: width 1620, height 2880.
          export const RemotionRoot: React.FC = () => {
            return (
              <Composition
                id="Main"
                component={Main}
                durationInFrames={300}
                fps={30}
                width={1920}
                height={1080}
              />
            );
          };
          EOF
          cat > "$PROJECT_DIR/src/Main.tsx" <<'EOF'
          import { AbsoluteFill, interpolate, spring, useCurrentFrame, useVideoConfig } from "remotion";

          export const Main: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps, width, height } = useVideoConfig();
            const u = Math.min(width, height) / 1080;

            // Ball drops with a real spring bounce
            const drop = spring({ frame, fps, config: { damping: 9, stiffness: 120, mass: 1 } });
            const ballY = interpolate(drop, [0, 1], [-300 * u, height * 0.55]);
            const glow = interpolate(Math.sin((frame / fps) * Math.PI), [-1, 1], [0.4, 1]);

            return (
              <AbsoluteFill style={{ background: "radial-gradient(circle at 50% 40%, #2a1060, #07031a 70%)" }}>
                <div
                  style={{
                    position: "absolute",
                    left: width / 2 - 90 * u,
                    top: ballY - 90 * u,
                    width: 180 * u,
                    height: 180 * u,
                    borderRadius: "50%",
                    background: "radial-gradient(circle at 35% 30%, #ffffff, #22d3ee 45%, #0e7490)",
                    boxShadow: `0 0 ${80 * u * glow}px ${20 * u * glow}px rgba(34,211,238,0.6)`,
                  }}
                />
              </AbsoluteFill>
            );
          };
          EOF

      - name: Install Remotion (bundled FFmpeg, no apt install)
        timeout-minutes: 10
        working-directory: my-remotion
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npx remotion versions
          npx remotion browser ensure

      - name: Render MP4
        if: ${{ inputs.mode == 'render' }}
        working-directory: my-remotion
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          set -euo pipefail
          if [[ ! "$COMPOSITION" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo '::error::Composition ID may only contain letters, numbers, - and _.'
            exit 1
          fi
          npx remotion compositions src/index.ts
          npx remotion render src/index.ts "$COMPOSITION" "out/$COMPOSITION.mp4"
          ls -lh out/
          echo "Rendered out/$COMPOSITION.mp4. Download it from the remotion-output artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Cloudflare client
        if: ${{ inputs.mode == 'studio' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" version

      - name: Write Live Panel files
        if: ${{ inputs.mode == 'studio' }}
        run: |
          mkdir -p "$RUNNER_TEMP/panel"
          cat > "$RUNNER_TEMP/panel/server.mjs" <<'PANEL_SERVER_EOF'
          // Remotion Live Panel: editor + Studio preview + render, behind one port.
          import http from 'node:http';
          import net from 'node:net';
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import path from 'node:path';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import { spawn } from 'node:child_process';
          import { createRequire } from 'node:module';
          import { fileURLToPath } from 'node:url';

          const HERE = path.dirname(fileURLToPath(import.meta.url));
          const PROJECT = path.resolve(process.env.PROJECT_DIR || process.cwd());
          const SRC = path.join(PROJECT, 'src');
          const OUT = path.join(PROJECT, 'out');
          const PORT = Number(process.env.PANEL_PORT || 3000);
          const STUDIO_PORT = Number(process.env.STUDIO_PORT || 3001);
          const SESSION_END = Number(process.env.SESSION_END || 0);
          const PASSWORD = process.env.PANEL_PASSWORD || '';
          const GH_TOKEN = process.env.GH_TOKEN || '';
          const REPO = process.env.GITHUB_REPOSITORY || '';
          const REF = process.env.GITHUB_REF_NAME || '';
          const WORKSPACE = process.env.GITHUB_WORKSPACE || path.dirname(PROJECT);
          const SESSION_TOKEN = crypto.randomBytes(32).toString('hex');
          const PAGE = fs.readFileSync(path.join(HERE, 'panel.html'), 'utf8');

          const req = createRequire(path.join(PROJECT, 'package.json'));
          let bundler = null, renderer = null;
          function loadRemotion() {
            if (!bundler) bundler = req('@remotion/bundler');
            if (!renderer) renderer = req('@remotion/renderer');
          }

          // ---------- helpers ----------
          function send(res, code, body, type = 'application/json; charset=utf-8', extra = {}) {
            const data = typeof body === 'string' || Buffer.isBuffer(body) ? body : JSON.stringify(body);
            res.writeHead(code, { 'content-type': type, 'cache-control': 'no-store', ...extra });
            res.end(data);
          }
          function readBody(r, limit = 2 * 1024 * 1024) {
            return new Promise((resolve, reject) => {
              const chunks = []; let n = 0;
              r.on('data', c => { n += c.length; if (n > limit) { reject(new Error('Body too large')); r.destroy(); } else chunks.push(c); });
              r.on('end', () => resolve(Buffer.concat(chunks).toString('utf8')));
              r.on('error', reject);
            });
          }
          function cookies(r) {
            const o = {};
            (r.headers.cookie || '').split(';').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i).trim()] = decodeURIComponent(p.slice(i + 1).trim()); });
            return o;
          }
          function authed(r) {
            if (!PASSWORD) return true;
            const c = cookies(r).rpanel || '';
            return c.length === SESSION_TOKEN.length && crypto.timingSafeEqual(Buffer.from(c), Buffer.from(SESSION_TOKEN));
          }
          function safeSrcPath(rel) {
            if (typeof rel !== 'string' || !/^[A-Za-z0-9_\-./]+$/.test(rel) || rel.includes('..')) return null;
            const abs = path.resolve(PROJECT, rel);
            if (!abs.startsWith(SRC + path.sep)) return null;
            if (!/\.(tsx|ts|jsx|js|css|json)$/.test(abs)) return null;
            return abs;
          }
          async function walk(dir, base = dir) {
            let out = [];
            for (const e of await fsp.readdir(dir, { withFileTypes: true }).catch(() => [])) {
              if (e.name === 'node_modules' || e.name.startsWith('.')) continue;
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out = out.concat(await walk(p, base));
              else out.push(p);
            }
            return out;
          }
          function run(cmd, args, opts = {}) {
            return new Promise(resolve => {
              const p = spawn(cmd, args, { cwd: opts.cwd || PROJECT, env: { ...process.env, ...(opts.env || {}) } });
              let out = '';
              const t = setTimeout(() => { out += '\n[timed out]'; p.kill('SIGKILL'); }, opts.timeout || 180000);
              p.stdout.on('data', d => { out += d; }); p.stderr.on('data', d => { out += d; });
              p.on('close', code => { clearTimeout(t); resolve({ code, out }); });
              p.on('error', e => { clearTimeout(t); resolve({ code: -1, out: String(e) }); });
            });
          }
          const redact = s => (GH_TOKEN ? s.split(GH_TOKEN).join('***') : s);

          // ---------- bundle cache + jobs ----------
          let cache = { key: '', serveUrl: '' };
          async function srcKey() {
            const files = (await walk(SRC)).concat([path.join(PROJECT, 'package.json')]);
            const h = crypto.createHash('sha1');
            for (const f of files.sort()) { const s = await fsp.stat(f).catch(() => null); if (s) h.update(f + s.mtimeMs + ':' + s.size); }
            return h.digest('hex');
          }
          async function getBundle(onProgress) {
            loadRemotion();
            const key = await srcKey();
            if (cache.key === key && fs.existsSync(cache.serveUrl)) return cache.serveUrl;
            const serveUrl = await bundler.bundle({ entryPoint: path.join(SRC, 'index.ts'), onProgress: p => onProgress && onProgress(p) });
            const old = cache.serveUrl;
            cache = { key, serveUrl };
            if (old && old !== serveUrl) fsp.rm(old, { recursive: true, force: true }).catch(() => {});
            return serveUrl;
          }
          let job = { status: 'idle' };
          let cancel = null;
          const busy = () => ['bundling', 'preparing', 'rendering'].includes(job.status);
          const stamp = () => new Date().toISOString().replace(/[-:T]/g, '').slice(4, 14);

          async function startRender(o) {
            loadRemotion();
            const id = String(o.composition || 'Main').replace(/[^A-Za-z0-9_-]/g, '') || 'Main';
            const crf = { best: 16, high: 20, small: 26 }[o.quality] || 20;
            const scale = [0.25, 0.5, 1, 2].includes(Number(o.scale)) ? Number(o.scale) : 1;
            const name = `${id}-${stamp()}${o.test ? '-test' : ''}${scale !== 1 ? '-x' + scale : ''}.mp4`;
            job = { status: 'bundling', progress: 0, stage: 'Bundling code…', started: Date.now(), file: name, composition: id };
            try {
              const serveUrl = await getBundle(p => { job.stage = `Bundling code… ${Math.round(p)}%`; });
              job.status = 'preparing'; job.stage = 'Opening composition…';
              const composition = await renderer.selectComposition({ serveUrl, id, inputProps: {} });
              const last = composition.durationInFrames - 1;
              const frameRange = o.test ? [0, Math.min(last, composition.fps * 3 - 1)] : null;
              job.total = frameRange ? frameRange[1] + 1 : composition.durationInFrames;
              job.meta = `${composition.width * scale} × ${composition.height * scale} · ${composition.fps} fps · ${job.total} frames`;
              await fsp.mkdir(OUT, { recursive: true });
              const c = renderer.makeCancelSignal(); cancel = c.cancel;
              job.status = 'rendering'; job.stage = 'Rendering frames…';
              await renderer.renderMedia({
                composition, serveUrl, codec: 'h264', crf, scale, frameRange,
                outputLocation: path.join(OUT, name), inputProps: {}, cancelSignal: c.cancelSignal,
                onProgress: p => {
                  job.progress = p.progress;
                  job.stage = p.stitchStage === 'muxing' ? 'Finishing MP4…' : `Frames ${p.renderedFrames}/${job.total} · encoded ${p.encodedFrames}`;
                },
              });
              job = { ...job, status: 'done', progress: 1, stage: 'Done', seconds: Math.round((Date.now() - job.started) / 1000) };
            } catch (e) {
              job = { ...job, status: job.status === 'cancelled' ? 'cancelled' : 'error', error: String(e && e.stack || e).slice(0, 4000) };
              fsp.rm(path.join(OUT, name), { force: true }).catch(() => {});
            } finally { cancel = null; }
          }

          // ---------- API ----------
          async function api(r, res, url) {
            const p = url.pathname.replace('/__panel/api/', '');
            if (p === 'info') return send(res, 200, { sessionEnd: SESSION_END, github: !!(GH_TOKEN && REPO), repo: REPO, ref: REF, password: !!PASSWORD });
            if (p === 'files') {
              const files = (await walk(SRC)).map(f => path.relative(PROJECT, f).split(path.sep).join('/')).filter(f => safeSrcPath(f));
              return send(res, 200, { files });
            }
            if (p === 'file') {
              const abs = safeSrcPath(url.searchParams.get('path'));
              if (!abs) return send(res, 400, { error: 'Invalid file path. Use src/Name.tsx' });
              if (r.method === 'GET') {
                const t = await fsp.readFile(abs, 'utf8').catch(() => null);
                return t === null ? send(res, 404, { error: 'Not found' }) : send(res, 200, { content: t });
              }
              if (r.method === 'PUT') {
                const body = await readBody(r);
                await fsp.mkdir(path.dirname(abs), { recursive: true });
                await fsp.writeFile(abs, body.replace(/\r\n/g, '\n'));
                return send(res, 200, { ok: true });
              }
            }
            if (p === 'check' && r.method === 'POST') {
              const tsc = path.join(PROJECT, 'node_modules', '.bin', 'tsc');
              if (!fs.existsSync(tsc)) return send(res, 200, { ok: false, out: 'TypeScript is not installed in this project (add "typescript" to devDependencies).' });
              const x = await run(tsc, ['--noEmit', '-p', '.'], { timeout: 180000 });
              return send(res, 200, { ok: x.code === 0, out: x.out.trim() || 'No TypeScript errors.' });
            }
            if (p === 'render' && r.method === 'POST') {
              if (busy()) return send(res, 409, { error: 'A render is already running.' });
              const o = JSON.parse((await readBody(r)) || '{}');
              startRender(o);
              return send(res, 202, { ok: true });
            }
            if (p === 'still' && r.method === 'POST') {
              if (busy()) return send(res, 409, { error: 'Wait for the current render to finish.' });
              const o = JSON.parse((await readBody(r)) || '{}');
              loadRemotion();
              const id = String(o.composition || 'Main').replace(/[^A-Za-z0-9_-]/g, '') || 'Main';
              job = { status: 'bundling', progress: 0, stage: 'Bundling for snapshot…', started: Date.now() };
              try {
                const serveUrl = await getBundle(pr => { job.stage = `Bundling code… ${Math.round(pr)}%`; });
                job = { status: 'preparing', stage: 'Rendering snapshot…', progress: 0 };
                const composition = await renderer.selectComposition({ serveUrl, id, inputProps: {} });
                const frame = Math.max(0, Math.min(composition.durationInFrames - 1, Math.round(Number(o.frame) || 0)));
                await fsp.mkdir(OUT, { recursive: true });
                const name = `still-${id}-f${frame}-${stamp()}.png`;
                await renderer.renderStill({ composition, serveUrl, frame, output: path.join(OUT, name), inputProps: {} });
                job = { status: 'idle' };
                return send(res, 200, { ok: true, file: name, frame });
              } catch (e) {
                job = { status: 'idle' };
                return send(res, 200, { ok: false, error: String(e && e.stack || e).slice(0, 4000) });
              }
            }
            if (p === 'job') return send(res, 200, job);
            if (p === 'cancel' && r.method === 'POST') { if (cancel) { job.status = 'cancelled'; cancel(); } return send(res, 200, { ok: true }); }
            if (p === 'outputs') {
              const list = [];
              for (const f of await fsp.readdir(OUT).catch(() => [])) {
                if (!/\.(mp4|mov|webm|gif|png|jpe?g|mp3|wav)$/i.test(f)) continue;
                const s = await fsp.stat(path.join(OUT, f)).catch(() => null);
                if (s && s.isFile()) list.push({ name: f, size: s.size, time: s.mtimeMs });
              }
              list.sort((a, b) => b.time - a.time);
              return send(res, 200, { files: list });
            }
            if (p === 'delete' && r.method === 'POST') {
              const name = path.basename(JSON.parse((await readBody(r)) || '{}').name || '');
              if (!name || (busy() && name === job.file)) return send(res, 400, { error: 'Cannot delete this file now.' });
              await fsp.rm(path.join(OUT, name), { force: true });
              return send(res, 200, { ok: true });
            }
            if (p === 'commit' && r.method === 'POST') {
              if (!GH_TOKEN || !REPO || !REF) return send(res, 200, { ok: false, out: 'GitHub saving is not available in this session.' });
              const o = JSON.parse((await readBody(r)) || '{}');
              const msg = String(o.message || '').trim().slice(0, 200) || 'Update animation from Remotion Live Panel';
              const rel = path.relative(WORKSPACE, PROJECT) || '.';
              const gi = path.join(PROJECT, '.gitignore');
              if (!fs.existsSync(gi)) await fsp.writeFile(gi, 'node_modules/\nout/\n.cache/\n');
              const remote = `https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git`;
              const g = (...a) => run('git', a, { cwd: WORKSPACE, timeout: 120000 });
              let log = '';
              const step = async (...a) => { const x = await g(...a); log += `$ git ${a[0]} …\n${x.out}`; return x; };
              await g('config', 'user.name', 'Remotion Live Panel');
              await g('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
              await step('add', '--', `${rel}/src`, `${rel}/package.json`, `${rel}/tsconfig.json`, `${rel}/.gitignore`);
              const diff = await g('diff', '--cached', '--quiet');
              if (diff.code === 0) return send(res, 200, { ok: true, out: 'Nothing new to save. GitHub already has this code.' });
              const c = await step('commit', '-m', msg);
              if (c.code !== 0) return send(res, 200, { ok: false, out: redact(log) });
              let push = await step('push', remote, `HEAD:refs/heads/${REF}`);
              if (push.code !== 0) {
                await step('pull', '--rebase', remote, REF);
                push = await step('push', remote, `HEAD:refs/heads/${REF}`);
              }
              return send(res, 200, { ok: push.code === 0, out: redact(log) });
            }
            return send(res, 404, { error: 'Unknown API' });
          }

          function serveOut(r, res, url) {
            const name = path.basename(decodeURIComponent(url.pathname.replace('/__panel/out/', '')));
            const abs = path.join(OUT, name);
            fs.stat(abs, (err, s) => {
              if (err || !s.isFile()) return send(res, 404, 'Not found', 'text/plain');
              const ext = path.extname(name).toLowerCase();
              const type = { '.mp4': 'video/mp4', '.mov': 'video/quicktime', '.webm': 'video/webm', '.gif': 'image/gif', '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.mp3': 'audio/mpeg', '.wav': 'audio/wav' }[ext] || 'application/octet-stream';
              const headers = { 'content-type': type, 'accept-ranges': 'bytes', 'cache-control': 'no-store' };
              if (url.searchParams.get('download')) headers['content-disposition'] = `attachment; filename="${name}"`;
              const m = /bytes=(\d*)-(\d*)/.exec(r.headers.range || '');
              if (m) {
                const start = m[1] ? Number(m[1]) : 0, end = m[2] ? Math.min(Number(m[2]), s.size - 1) : s.size - 1;
                if (start > end || start >= s.size) { res.writeHead(416, { 'content-range': `bytes */${s.size}` }); return res.end(); }
                res.writeHead(206, { ...headers, 'content-range': `bytes ${start}-${end}/${s.size}`, 'content-length': end - start + 1 });
                return fs.createReadStream(abs, { start, end }).pipe(res);
              }
              res.writeHead(200, { ...headers, 'content-length': s.size });
              fs.createReadStream(abs).pipe(res);
            });
          }

          // ---------- Studio proxy ----------
          function proxy(r, res) {
            const p = http.request({ host: '127.0.0.1', port: STUDIO_PORT, method: r.method, path: r.url, headers: r.headers }, pr => {
              res.writeHead(pr.statusCode || 502, pr.headers);
              pr.pipe(res);
            });
            p.on('error', () => { if (!res.headersSent) send(res, 502, '<p style="font:16px sans-serif;padding:24px">Remotion Studio is starting… reload in a few seconds.</p>', 'text/html; charset=utf-8'); else res.end(); });
            r.pipe(p);
          }

          const LOGIN = err => `<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remotion Live Panel</title><body style="margin:0;display:grid;place-items:center;height:100vh;background:#0b1020;color:#e2e8f0;font:16px system-ui"><form method="post" action="/__panel/login" style="background:#121a2e;padding:28px;border-radius:14px;width:300px;display:grid;gap:12px"><b style="font-size:18px">Remotion Live Panel</b>${err ? '<span style="color:#f87171">Wrong password</span>' : ''}<input name="password" type="password" placeholder="Panel password" autofocus style="padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1020;color:#fff"><button style="padding:10px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:600">Open panel</button></form>`;

          const server = http.createServer(async (r, res) => {
            try {
              const url = new URL(r.url, 'http://x');
              if (url.pathname === '/__panel/health') return send(res, 200, 'ok', 'text/plain');
              if (url.pathname === '/__panel/login') {
                if (r.method === 'POST') {
                  const pw = new URLSearchParams(await readBody(r, 10000)).get('password') || '';
                  const a = crypto.createHash('sha256').update(pw).digest(), b = crypto.createHash('sha256').update(PASSWORD).digest();
                  if (PASSWORD && crypto.timingSafeEqual(a, b)) return send(res, 302, '', 'text/plain', { location: '/__panel/', 'set-cookie': `rpanel=${SESSION_TOKEN}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400` });
                  return send(res, 401, LOGIN(true), 'text/html; charset=utf-8');
                }
                return send(res, 200, LOGIN(false), 'text/html; charset=utf-8');
              }
              if (!authed(r)) {
                if ((r.headers['sec-fetch-dest'] || 'document') === 'document' && r.method === 'GET') return send(res, 302, '', 'text/plain', { location: '/__panel/login' });
                return send(res, 401, { error: 'Login required' });
              }
              if (url.pathname === '/__panel' || url.pathname === '/__panel/') return send(res, 200, PAGE, 'text/html; charset=utf-8');
              if (url.pathname.startsWith('/__panel/api/')) return await api(r, res, url);
              if (url.pathname.startsWith('/__panel/out/')) return serveOut(r, res, url);
              // A normal page visit to "/" opens the panel; the iframe (and /?studio) gets Remotion Studio.
              if (r.url === '/' && r.method === 'GET' && (r.headers['sec-fetch-dest'] || 'document') === 'document') return send(res, 302, '', 'text/plain', { location: '/__panel/' });
              return proxy(r, res);
            } catch (e) {
              if (!res.headersSent) send(res, 500, { error: String(e && e.message || e) }); else res.end();
            }
          });
          server.on('upgrade', (r, sock, head) => {
            if (!authed(r)) { sock.end('HTTP/1.1 401 Unauthorized\r\n\r\n'); return; }
            const up = net.connect(STUDIO_PORT, '127.0.0.1', () => {
              let h = `${r.method} ${r.url} HTTP/${r.httpVersion}\r\n`;
              for (let i = 0; i < r.rawHeaders.length; i += 2) h += `${r.rawHeaders[i]}: ${r.rawHeaders[i + 1]}\r\n`;
              up.write(h + '\r\n'); if (head && head.length) up.write(head);
              sock.pipe(up).pipe(sock);
            });
            up.on('error', () => sock.destroy()); sock.on('error', () => up.destroy());
          });
          server.requestTimeout = 0;
          server.headersTimeout = 60000;
          server.listen(PORT, '127.0.0.1', () => console.log(`Remotion Live Panel on http://127.0.0.1:${PORT}/__panel/ (Studio proxied from ${STUDIO_PORT}) cpus=${os.cpus().length}`));
          PANEL_SERVER_EOF
          cat > "$RUNNER_TEMP/panel/panel.html" <<'PANEL_HTML_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Remotion Live Panel</title>
          <style>
          :root{--bg:#0b1020;--card:#121a2e;--line:#243047;--text:#e2e8f0;--muted:#94a3b8;--acc:#6366f1;--ok:#22c55e;--bad:#f87171;--warn:#fbbf24}
          *{box-sizing:border-box}
          html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
          button,select,input,textarea{font:inherit;color:inherit}
          button{background:#1e293b;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
          button:hover{border-color:#475569}
          a{color:inherit;text-decoration:none}
          button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
          button.danger{color:var(--bad)}
          button:disabled{opacity:.5;cursor:not-allowed}
          select,input[type=text],input[type=number]{background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
          header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0e1528}
