          .left{border-right:1px solid var(--line)}
          .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
          .bar .grow{flex:1}
          #editor{flex:1;min-height:200px;position:relative}
          #editor textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;padding:12px;background:#0b1020;color:#dbeafe;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;outline:none}
          #console{height:150px;overflow:auto;margin:0;padding:10px;border-top:1px solid var(--line);background:#070b16;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:var(--muted)}
          #console.ok{color:#86efac}#console.bad{color:#fca5a5}
          #studioWrap{flex:1;min-height:280px;position:relative;background:#000}
          #studio{position:absolute;inset:0;width:100%;height:100%;border:0}
          .render{max-height:46%;overflow:auto;border-top:1px solid var(--line);padding:12px;display:grid;gap:12px;background:var(--card)}
          .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
          .row label{color:var(--muted);font-size:12px;display:grid;gap:3px}
          .progress{height:10px;background:#1e293b;border-radius:99px;overflow:hidden}
          .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#22d3ee);transition:width .3s}
          #stage{color:var(--muted);font-size:13px}
          #renderErr{color:#fca5a5;white-space:pre-wrap;font:12px ui-monospace,monospace;margin:0;max-height:160px;overflow:auto}
          .outputs{display:grid;gap:6px}
          .out{display:flex;gap:8px;align-items:center;background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
          .out span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .out small{color:var(--muted)}
          .muted{color:var(--muted)}
          h3{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
          dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(860px,94vw);padding:0}
          dialog::backdrop{background:rgba(0,0,0,.6)}
          .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
          .db{padding:14px 16px;display:grid;gap:10px}
          .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
          dialog textarea{width:100%;height:46vh;background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:10px;color:#dbeafe;font:12px/1.5 ui-monospace,monospace}
          dialog video,dialog img{max-width:100%;max-height:70vh;display:block;margin:auto;background:#000}
          pre.log{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#070b16;padding:10px;border-radius:8px;max-height:40vh;overflow:auto;margin:0}
          .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
          .dot.clean{background:var(--ok)}
          @media (max-width:1000px){main{display:block;height:auto}.left{border-right:0}#editor{height:60vh}#studioWrap{height:62vh}.render{max-height:none}}
          </style>
          </head>
          <body>
          <header>
            <b>Remotion Live Panel</b>
            <span class="pill" id="timer"></span>
            <button id="pasteBtn" title="Paste a full AI answer; Root.tsx and Main.tsx are split out automatically">Paste AI answer</button>
            <button id="ghBtn" hidden>Save to GitHub</button>
            <a href="/?studio" target="_blank" rel="noopener"><button>Studio full screen ↗</button></a>
          </header>
          <main>
            <section class="col left">
              <div class="bar">
                <span class="dot clean" id="dirtyDot" title="Saved"></span>
                <select id="fileSel" aria-label="File"></select>
                <button id="newBtn" title="Create a new file in src/">+ File</button>
                <span class="grow"></span>
                <button id="checkBtn" title="Run TypeScript strict check">Check code</button>
                <button class="primary" id="saveBtn" title="Ctrl+S">Save</button>
              </div>
              <div id="editor"></div>
              <pre id="console">Edit a file and press Save (Ctrl+S). Remotion Studio on the right reloads automatically.</pre>
            </section>
            <section class="col">
              <div id="studioWrap"><iframe id="studio" src="/?studio" title="Remotion Studio"></iframe></div>
              <div class="render">
                <div class="row" style="justify-content:space-between"><h3>Render MP4</h3><button id="reloadStudio" title="Reload the Studio preview">Reload preview</button></div>
                <div class="row">
                  <label>Composition<input type="text" id="comp" value="Main" size="10"></label>
                  <label>Quality<select id="quality"><option value="best">Best (CRF 16)</option><option value="high" selected>High (CRF 20)</option><option value="small">Small file (CRF 26)</option></select></label>
                  <label>Size<select id="scale"><option value="1" selected>Full size (from Root.tsx)</option><option value="0.5">Half size (fast check)</option><option value="0.25">Quarter size (fastest)</option><option value="2">2× upscale</option></select></label>
                  <label style="display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px;margin-top:14px"><input type="checkbox" id="test"> Quick test (first 3 s)</label>
                </div>
                <div class="row">
                  <button class="primary" id="renderBtn">Render ▶</button>
                  <button class="danger" id="cancelBtn" hidden>Cancel</button>
                  <span id="stage">Ready.</span>
                </div>
                <div class="progress"><i id="bar"></i></div>
                <pre id="renderErr"></pre>
                <div class="row">
                  <label>Snapshot frame<input type="number" id="frame" value="0" min="0" style="width:90px"></label>
                  <button id="stillBtn" style="margin-top:14px">Snapshot PNG</button>
                </div>
                <div class="row" style="justify-content:space-between"><h3>Your files (out/)</h3><button id="refreshOut">Refresh</button></div>
                <div class="outputs" id="outputs"><span class="muted">No renders yet.</span></div>
              </div>
            </section>
          </main>

          <dialog id="pasteDlg"><div class="dh"><b>Paste AI answer</b><button data-close>×</button></div>
          <div class="db"><span class="muted">Paste the whole AI reply. Code blocks for Root.tsx and Main.tsx (and any other src/ files) are detected and saved automatically.</span><textarea id="pasteText" spellcheck="false" placeholder="Paste here…"></textarea><pre class="log" id="pasteLog" hidden></pre></div>
          <div class="df"><button data-close>Close</button><button class="primary" id="pasteGo">Split &amp; save</button></div></dialog>

          <dialog id="ghDlg"><div class="dh"><b>Save code to GitHub</b><button data-close>×</button></div>
          <div class="db"><span class="muted" id="ghInfo"></span><input type="text" id="ghMsg" placeholder="Commit message (optional)" maxlength="200"><pre class="log" id="ghLog" hidden></pre></div>
          <div class="df"><button data-close>Close</button><button class="primary" id="ghGo">Commit &amp; push</button></div></dialog>

          <dialog id="viewDlg"><div class="dh"><b id="viewName"></b><button data-close>×</button></div><div class="db" id="viewBody"></div></dialog>

          <script>
          (function(){
          'use strict';
          var $=function(id){return document.getElementById(id);};
          var MONACO='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
          var files={},current='',editor=null,info={};
          function api(path,opt){return fetch('/__panel/api/'+path,opt||{}).then(function(r){return r.json().then(function(j){if(!r.ok&&r.status!==409)throw new Error(j.error||('HTTP '+r.status));return j;});});}
          function log(t,cls){var c=$('console');c.textContent=t;c.className=cls||'';}
          function size(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
          function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

          // ---------- editor (Monaco, textarea fallback) ----------
          var ed={get:function(){return ta.value;},set:function(t){ta.value=t;},focus:function(){ta.focus();}};
          var ta=document.createElement('textarea');ta.spellcheck=false;$('editor').appendChild(ta);
          ta.addEventListener('input',markDirty);
          ta.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');markDirty();}});
          function loadMonaco(){
            window.MonacoEnvironment={getWorkerUrl:function(){return 'data:text/javascript;charset=utf-8,'+encodeURIComponent("self.MonacoEnvironment={baseUrl:'"+MONACO+"/'};importScripts('"+MONACO+"/vs/base/worker/workerMain.js');");}};
            var s=document.createElement('script');s.src=MONACO+'/vs/loader.js';
            s.onload=function(){
              window.require.config({paths:{vs:MONACO+'/vs'}});
              window.require(['vs/editor/editor.main'],function(){
                var m=window.monaco,tsd=m.languages.typescript.typescriptDefaults;
                tsd.setCompilerOptions({jsx:m.languages.typescript.JsxEmit.ReactJSX,target:m.languages.typescript.ScriptTarget.ESNext,allowNonTsExtensions:true,moduleResolution:m.languages.typescript.ModuleResolutionKind.NodeJs});
                tsd.setDiagnosticsOptions({noSemanticValidation:true,noSyntaxValidation:false});
                var text=ta.value;ta.remove();
                editor=m.editor.create($('editor'),{value:text,language:'typescript',theme:'vs-dark',automaticLayout:true,fontSize:13,minimap:{enabled:false},tabSize:2,scrollBeyondLastLine:false,wordWrap:'on'});
                setModel(current,text);
                editor.onDidChangeModelContent(markDirty);
                editor.addCommand(m.KeyMod.CtrlCmd|m.KeyCode.KeyS,save);
                ed={get:function(){return editor.getValue();},set:function(t){setModel(current,t);},focus:function(){editor.focus();}};
              });
            };
            document.head.appendChild(s);
          }
          function setModel(p,t){
            if(!editor)return;var m=window.monaco,uri=m.Uri.parse('file:///'+(p||'scratch.tsx'));
            var model=m.editor.getModel(uri);
            if(!model)model=m.editor.createModel(t,/\.css$/.test(p)?'css':/\.json$/.test(p)?'json':'typescript',uri);
            else if(model.getValue()!==t)model.setValue(t);
            editor.setModel(model);
          }
          var suppress=false;
          function markDirty(){if(suppress||!current)return;files[current].text=ed.get();updateDot();}
          function updateDot(){var f=files[current],d=f&&f.text!==f.saved;$('dirtyDot').className='dot'+(d?'':' clean');$('dirtyDot').title=d?'Unsaved changes':'Saved';
            [].forEach.call($('fileSel').options,function(o){var x=files[o.value];o.textContent=o.value.replace(/^src\//,'')+(x&&x.text!==x.saved?' •':'');});}
          function open(p){
            if(current&&files[current])files[current].text=ed.get();
            current=p;$('fileSel').value=p;
            var go=function(){suppress=true;ed.set(files[p].text);suppress=false;updateDot();};
            if(files[p]&&files[p].text!=null)return go();
            api('file?path='+encodeURIComponent(p)).then(function(j){files[p]={saved:j.content,text:j.content};go();}).catch(function(e){log(String(e),'bad');});
          }
          function listFiles(select){
            return api('files').then(function(j){
              var sel=$('fileSel');sel.innerHTML='';
              var order=function(a){return a==='src/Main.tsx'?0:a==='src/Root.tsx'?1:a==='src/index.ts'?3:2;};
              j.files.sort(function(a,b){return order(a)-order(b)||a.localeCompare(b);}).forEach(function(f){if(!files[f])files[f]={saved:null,text:null};var o=document.createElement('option');o.value=f;sel.appendChild(o);});
              updateDot();
              var target=select||current||(j.files.indexOf('src/Main.tsx')!==-1?'src/Main.tsx':j.files[0]);
              if(target)open(target);else log('No files in src/ yet. Use "Paste AI answer" or "+ File".');
            });
          }
          function writeFile(p,t){return fetch('/__panel/api/file?path='+encodeURIComponent(p),{method:'PUT',body:t}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Save failed');files[p]={saved:t,text:t};});}
          function save(){
            if(!current)return;var p=current,t=ed.get();
            $('saveBtn').disabled=true;
            writeFile(p,t).then(function(){updateDot();log('Saved '+p+' at '+new Date().toLocaleTimeString()+'. Studio reloads automatically. Press "Check code" for a TypeScript strict check.','ok');})
            .catch(function(e){log(String(e),'bad');}).then(function(){$('saveBtn').disabled=false;});
          }
          $('saveBtn').onclick=save;
          document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}});
          $('fileSel').onchange=function(){open(this.value);};
          $('newBtn').onclick=function(){
            var n=prompt('New file name inside src/ (for example Scene1.tsx or components/Logo.tsx)');if(!n)return;
            n='src/'+n.replace(/^\/?(src\/)?/,'').trim();
            if(!/^[A-Za-z0-9_\-./]+\.(tsx|ts|jsx|js|css|json)$/.test(n)||n.indexOf('..')!==-1)return alert('Use a name like Scene1.tsx');
            if(files[n]&&files[n].saved!=null)return open(n);
            writeFile(n,'').then(function(){return listFiles(n);}).catch(function(e){log(String(e),'bad');});
          };
          $('checkBtn').onclick=function(){
            var b=this;b.disabled=true;log('Running TypeScript strict check… (save first; this checks saved files)');
            api('check',{method:'POST'}).then(function(j){log(j.out,j.ok?'ok':'bad');}).catch(function(e){log(String(e),'bad');}).then(function(){b.disabled=false;});
          };
          window.addEventListener('beforeunload',function(e){if(current)files[current].text=ed.get();for(var k in files){if(files[k].text!=null&&files[k].text!==files[k].saved){e.preventDefault();e.returnValue='';return;}}});

          // ---------- paste AI answer ----------
          function dlg(id){var d=$(id);[].forEach.call(d.querySelectorAll('[data-close]'),function(b){b.onclick=function(){d.close();};});return d;}
          $('pasteBtn').onclick=function(){$('pasteLog').hidden=true;dlg('pasteDlg').showModal();$('pasteText').focus();};
          function split(text){
            var blocks=[],re=/```[^\n`]*\n([\s\S]*?)```/g,m;
            while((m=re.exec(text)))blocks.push({code:m[1],before:text.slice(Math.max(0,m.index-240),m.index),head:text.slice(m.index,m.index+80)});
            if(!blocks.length)blocks.push({code:text,before:'',head:''});
            var out={},skipped=[];
            blocks.forEach(function(b){
              var code=b.code.replace(/\s+$/,'')+'\n',name='';
              var first=code.split('\n').slice(0,3).join('\n');
              var m1=/(?:\/\/|\/\*)\s*((?:src\/)?[A-Za-z0-9_\-/]+\.(?:tsx|ts|jsx|js|css))/.exec(first)||/((?:src\/)?[A-Za-z0-9_\-/]+\.(?:tsx|ts|jsx|js|css))[^\n]*$/.exec(b.head.split('\n')[0]);
              if(m1)name=m1[1];
              if(!name){var all=b.before.match(/(?:src\/)?[A-Za-z0-9_\-]+\.(?:tsx|ts)/g);if(all)name=all[all.length-1];}
              if(/<Composition[\s>]/.test(code)&&/registerRoot/.test(code)===false&&!/Root\.tsx$/.test(name)&&/export const (RemotionRoot|Root)/.test(code))name='Root.tsx';
              if(!name&&/<Composition[\s>]/.test(code))name='Root.tsx';
              if(!name&&/export\s+const\s+Main\b/.test(code))name='Main.tsx';
              if(!name){skipped.push(code.slice(0,60));return;}
              name='src/'+name.replace(/^src\//,'');
              if(/package\.json$/.test(name)){skipped.push(name);return;}
              out[name]=code;
            });
            return {files:out,skipped:skipped};
          }
          $('pasteGo').onclick=function(){
            var r=split($('pasteText').value),names=Object.keys(r.files),L=$('pasteLog');L.hidden=false;
            if(!names.length){L.textContent='No Remotion code found. Make sure the answer has code blocks for Root.tsx / Main.tsx.';return;}
            if(names.indexOf('src/index.ts')!==-1&&!confirm('The answer also contains src/index.ts. Overwrite it?'))delete r.files['src/index.ts'];
            names=Object.keys(r.files);
            Promise.all(names.map(function(n){return writeFile(n,r.files[n]);})).then(function(){
              L.textContent='Saved: '+names.join(', ')+(r.skipped.length?'\nSkipped '+r.skipped.length+' block(s) without a file name.':'')+'\nStudio reloads automatically.';
              log('Saved from AI answer: '+names.join(', '),'ok');
              current='';return listFiles(names.indexOf('src/Main.tsx')!==-1?'src/Main.tsx':names[0]);
            }).catch(function(e){L.textContent=String(e);});
          };

          // ---------- GitHub ----------
          $('ghBtn').onclick=function(){$('ghLog').hidden=true;$('ghInfo').textContent='Commits my-remotion/src (and package.json / tsconfig.json) to '+info.repo+' on branch '+info.ref+'. Save your files first.';dlg('ghDlg').showModal();};
          $('ghGo').onclick=function(){
            var b=this;b.disabled=true;$('ghLog').hidden=false;$('ghLog').textContent='Pushing…';
            api('commit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:$('ghMsg').value})})
            .then(function(j){$('ghLog').textContent=(j.ok?'✓ Saved to GitHub.\n\n':'✗ Failed.\n\n')+j.out;}).catch(function(e){$('ghLog').textContent=String(e);}).then(function(){b.disabled=false;});
          };

          // ---------- render ----------
          var polling=null;
          function setBusy(on){$('renderBtn').disabled=on;$('stillBtn').disabled=on;$('cancelBtn').hidden=!on;}
          function poll(){
            api('job').then(function(j){
              var busy=['bundling','preparing','rendering'].indexOf(j.status)!==-1;
              setBusy(busy);
              $('bar').style.width=Math.round((j.progress||0)*100)+'%';
              if(busy){$('stage').textContent=(j.stage||'Working…')+(j.meta?' · '+j.meta:'');}
              else if(j.status==='done'){$('stage').textContent='✓ Done in '+j.seconds+' s · '+j.file;}
              else if(j.status==='error'){$('stage').textContent='✗ Render failed';$('renderErr').textContent=j.error||'';}
              else if(j.status==='cancelled'){$('stage').textContent='Cancelled.';}
              if(busy&&!polling)polling=setInterval(poll,1000);
              if(!busy&&polling){clearInterval(polling);polling=null;outputs();}
            }).catch(function(){});
          }
          function startPoll(){if(!polling)polling=setInterval(poll,1000);poll();}
          $('renderBtn').onclick=function(){
            if(Object.keys(files).some(function(k){return files[k].text!=null&&files[k].text!==files[k].saved;})&&!confirm('You have unsaved changes. Render the last SAVED version?'))return;
            $('renderErr').textContent='';$('bar').style.width='0';
            api('render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({composition:$('comp').value,quality:$('quality').value,scale:$('scale').value,test:$('test').checked})})
            .then(function(j){if(j.error){$('stage').textContent=j.error;}startPoll();}).catch(function(e){$('stage').textContent=String(e);});
          };
          $('cancelBtn').onclick=function(){api('cancel',{method:'POST'});};
          $('stillBtn').onclick=function(){
            var b=this;b.disabled=true;$('renderErr').textContent='';$('stage').textContent='Rendering snapshot…';
            api('still',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({composition:$('comp').value,frame:$('frame').value})})
            .then(function(j){if(j.ok){$('stage').textContent='✓ Snapshot of frame '+j.frame;view(j.file);outputs();}else{$('stage').textContent='✗ Snapshot failed';$('renderErr').textContent=j.error||'';}})
            .catch(function(e){$('stage').textContent=String(e);}).then(function(){b.disabled=false;});
          };
          function view(name){
            var u='/__panel/out/'+encodeURIComponent(name),body=$('viewBody');$('viewName').textContent=name;
            body.innerHTML=/\.png|\.jpe?g|\.gif$/i.test(name)?'<img alt="" src="'+u+'?t='+Date.now()+'">':'<video controls autoplay loop playsinline src="'+u+'"></video>';
            body.insertAdjacentHTML('beforeend','<div class="row" style="justify-content:flex-end"><a href="'+u+'?download=1"><button class="primary">Download</button></a></div>');
            var d=dlg('viewDlg');d.onclose=function(){body.innerHTML='';};d.showModal();
          }
          function outputs(){
            api('outputs').then(function(j){
              var box=$('outputs');
              if(!j.files.length){box.innerHTML='<span class="muted">No renders yet.</span>';return;}
              box.innerHTML=j.files.map(function(f){var u='/__panel/out/'+encodeURIComponent(f.name);return '<div class="out"><span title="'+esc(f.name)+'">'+esc(f.name)+'</span><small>'+size(f.size)+'</small><button data-view="'+esc(f.name)+'">Preview</button><a href="'+u+'?download=1"><button>Download</button></a><button class="danger" data-del="'+esc(f.name)+'" title="Delete">×</button></div>';}).join('');
            });
          }
          $('outputs').onclick=function(e){
            var t=e.target.closest('button');if(!t)return;
            if(t.dataset.view)view(t.dataset.view);
            if(t.dataset.del&&confirm('Delete '+t.dataset.del+'?'))api('delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:t.dataset.del})}).then(outputs);
          };
          $('refreshOut').onclick=outputs;
          $('reloadStudio').onclick=function(){$('studio').src='/?studio&t='+Date.now();};

          // ---------- session timer ----------
          function tick(){
            if(!info.sessionEnd){$('timer').textContent='';return;}
            var s=Math.max(0,Math.round(info.sessionEnd-Date.now()/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
            $('timer').textContent=s?('Session ends in '+(h?h+'h ':'')+m+'m'):'Session ended';
            $('timer').style.color=s<900?'#fbbf24':'';
          }
          api('info').then(function(j){info=j;$('ghBtn').hidden=!j.github;tick();setInterval(tick,15000);});
          listFiles();outputs();poll();loadMonaco();
          })();
          </script>
          </body>
          </html>
          PANEL_HTML_EOF
          node --check "$RUNNER_TEMP/panel/server.mjs"

      - name: Start Remotion Live Panel session
        if: ${{ inputs.mode == 'studio' }}
        working-directory: my-remotion
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: |
          set -euo pipefail
          case "$SESSION_MINUTES" in 30|60|330) ;; *) exit 1 ;; esac
          STUDIO_PID=''
          PANEL_PID=''
          TUNNEL_PID=''
          cleanup() {
            [[ -z "$TUNNEL_PID" ]] || kill "$TUNNEL_PID" 2>/dev/null || true
            [[ -z "$PANEL_PID" ]] || kill "$PANEL_PID" 2>/dev/null || true
            [[ -z "$STUDIO_PID" ]] || kill "$STUDIO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Remotion Studio (preview) runs on 3001; the Live Panel on 3000 shows it.
          npx remotion studio src/index.ts --port 3001 --no-open \
            > "$RUNNER_TEMP/studio.log" 2>&1 &
          STUDIO_PID=$!

          READY=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$STUDIO_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$READY" != true ]]; then
            tail -n 80 "$RUNNER_TEMP/studio.log"
            echo '::error::Remotion Studio did not start. Check the log above for code errors.'
            exit 1
          fi

          SESSION_END=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          PROJECT_DIR="$PWD" PANEL_PORT=3000 STUDIO_PORT=3001 SESSION_END="$SESSION_END" \
            node "$RUNNER_TEMP/panel/server.mjs" > "$RUNNER_TEMP/panel.log" 2>&1 &
          PANEL_PID=$!

          READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/__panel/health > /dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$PANEL_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$READY" != true ]]; then
            tail -n 60 "$RUNNER_TEMP/panel.log"
            echo '::error::The Live Panel did not start.'
            exit 1
          fi

          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:3000 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          TUNNEL_PID=$!

          PUBLIC_URL=''
          for attempt in $(seq 1 60); do
            PUBLIC_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
              "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)
            if [[ -n "$PUBLIC_URL" ]]; then break; fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ -z "$PUBLIC_URL" ]]; then
            echo '::error::Cloudflare did not provide a tunnel URL.'
            tail -n 40 "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          # Wait until the tunnel is registered AND the public URL really answers.
          # Opening the link too early makes browsers/ISPs cache "DNS not found".
          echo 'Waiting for the public link to go live (up to 3 minutes)...'
          LIVE=false
          for attempt in $(seq 1 36); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then break; fi
            if grep -q 'Registered tunnel connection' "$RUNNER_TEMP/cloudflared.log"; then
              CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 15 --doh-url https://1.1.1.1/dns-query \
                "$PUBLIC_URL/__panel/health" || true)
              if [[ "$CODE" == 200 ]]; then LIVE=true; break; fi
            fi
            sleep 5
          done
          if [[ "$LIVE" != true ]]; then
            echo '::error::The Cloudflare link never became reachable. Re-run the workflow.'
            tail -n 40 "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          if [[ -n "$PANEL_PASSWORD" ]]; then
            LOCK='Password protected: use your PANEL_PASSWORD secret.'
          else
            LOCK='No password set: anyone with this link can open it, so do not share it. Add a PANEL_PASSWORD repository secret to lock it.'
          fi
          echo "Open Remotion Live Panel: $PUBLIC_URL"
          echo "$LOCK"
          {
            echo '## Remotion Live Panel'
            echo
            echo "[Open Remotion Live Panel]($PUBLIC_URL)"
            echo
            echo "$LOCK"
            echo
            echo "Session duration: $SESSION_MINUTES minutes after startup."
            echo
            echo 'Edit or paste code, Save, watch Studio update, then Render and Download the MP4 on the same page. Your src/ code and out/ renders are saved in the remotion-output artifact when the session ends.'
          } >> "$GITHUB_STEP_SUMMARY"

          while (( $(date +%s) < SESSION_END )); do
            if ! kill -0 "$STUDIO_PID" 2>/dev/null || ! kill -0 "$PANEL_PID" 2>/dev/null || ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo '::error::Remotion Studio, the panel or the tunnel stopped unexpectedly.'
              tail -n 60 "$RUNNER_TEMP/studio.log"
              tail -n 40 "$RUNNER_TEMP/panel.log"
              tail -n 40 "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            sleep 10
          done

      - name: Save rendered videos and project files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remotion-output-${{ github.run_id }}
          path: |
            my-remotion/
            !my-remotion/node_modules/**
            !my-remotion/**/.cache/**
            !my-remotion/**/.env*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 3
