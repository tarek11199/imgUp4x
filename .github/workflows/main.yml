Date.now()+\\'\">\\':\\'<video controls autoplay loop playsinline src=\"\\'+u+\\'\"></video>\\';\\n  body.insertAdjacentHTML(\\'beforeend\\',\\'<div class=\"row\" style=\"justify-content:flex-end\"><a href=\"\\'+u+\\'?download=1\"><button class=\"primary\">Download</button></a></div>\\');\\n  var d=dlg(\\'viewDlg\\');d.onclose=function(){body.innerHTML=\\'\\';};d.showModal();\\n}\\nfunction outputs(){\\n  api(\\'outputs\\').then(function(j){\\n    var box=$(\\'outputs\\');\\n    if(!j.files.length){box.innerHTML=\\'<span class=\"muted\">No renders yet.</span>\\';return;}\\n    box.innerHTML=j.files.map(function(f){var u=\\'/__panel/out/\\'+encodeURIComponent(f.name);return \\'<div class=\"out\"><span title=\"\\'+esc(f.name)+\\'\">\\'+esc(f.name)+\\'</span><small>\\'+size(f.size)+\\'</small><button data-view=\"\\'+esc(f.name)+\\'\">Preview</button><a href=\"\\'+u+\\'?download=1\"><button>Download</button></a><button class=\"danger\" data-del=\"\\'+esc(f.name)+\\'\" title=\"Delete\">×</button></div>\\';}).join(\\'\\');\\n  });\\n}\\n$(\\'outputs\\').onclick=function(e){\\n  var t=e.target.closest(\\'button\\');if(!t)return;\\n  if(t.dataset.view)view(t.dataset.view);\\n  if(t.dataset.del&&confirm(\\'Delete \\'+t.dataset.del+\\'?\\'))api(\\'delete\\',{method:\\'POST\\',headers:{\\'content-type\\':\\'application/json\\'},body:JSON.stringify({name:t.dataset.del})}).then(outputs);\\n};\\n$(\\'refreshOut\\').onclick=outputs;\\n$(\\'reloadStudio\\').onclick=function(){$(\\'studio\\').src=\\'/?studio&t=\\'+Date.now();};\\n\\n// ---------- session timer ----------\\nfunction tick(){\\n  if(!info.sessionEnd){$(\\'timer\\').textContent=\\'\\';return;}\\n  var s=Math.max(0,Math.round(info.sessionEnd-Date.now()/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);\\n  $(\\'timer\\').textContent=s?(\\'Session ends in \\'+(h?h+\\'h \\':\\'\\')+m+\\'m\\'):\\'Session ended\\';\\n  $(\\'timer\\').style.color=s<900?\\'#fbbf24\\':\\'\\';\\n}\\napi(\\'info\\').then(function(j){info=j;if(j.gpu){$(\\'gpuPill\\').hidden=false;$(\\'gpuPill\\').textContent=\\'⚡ GPU render: \\'+j.gpu;$(\\'gpuPill\\').style.color=\\'#86efac\\';}$(\\'ghBtn\\').hidden=!j.github;tick();setInterval(tick,15000);});\\nlistFiles();outputs();poll();loadMonaco();\\n})();\\n</script>\\n</body>\\n</html>\\n')\n",
    "\n",
    "import os, signal\n",
    "for p in globals().get(\"_procs\", []):\n",
    "    try: os.killpg(p.pid, signal.SIGTERM)\n",
    "    except Exception: pass\n",
    "_procs = []\n",
    "def bg(cmd, log, env=None, cwd=PROJECT):\n",
    "    p = subprocess.Popen(cmd, shell=True, cwd=cwd, stdout=open(log, \"w\"), stderr=subprocess.STDOUT,\n",
    "                         env={**os.environ, **(env or {})}, start_new_session=True)\n",
    "    _procs.append(p)\n",
    "    return p\n",
    "def wait_http(url, secs, proc=None):\n",
    "    for _ in range(secs):\n",
    "        try:\n",
    "            if urllib.request.urlopen(url, timeout=5).status == 200: return True\n",
    "        except Exception: pass\n",
    "        if proc is not None and proc.poll() is not None: return False\n",
    "        time.sleep(1)\n",
    "    return False\n",
    "\n",
    "studio = bg(\"npx remotion studio src/index.ts --port 3001 --no-open\", \"/content/studio.log\")\n",
    "if not wait_http(\"http://127.0.0.1:3001/\", 180, studio):\n",
    "    print(open(\"/content/studio.log\").read()[-3000:]); raise RuntimeError(\"Remotion Studio did not start.\")\n",
    "\n",
    "GPU_GL = open(\"/content/remotion_gl.txt\").read().strip() if os.path.exists(\"/content/remotion_gl.txt\") else \"\"\n",
    "env = {\"PROJECT_DIR\": PROJECT, \"PANEL_PORT\": \"3000\", \"STUDIO_PORT\": \"3001\", \"PANEL_PASSWORD\": PANEL_PASSWORD}\n",
    "if USE_GPU and GPU_GL:\n",
    "    env.update({\"RENDER_GL\": GPU_GL, \"CHROME_MODE\": \"chrome-for-testing\"})\n",
    "panel = bg(f\"node {PANEL_DIR}/server.mjs\", \"/content/panel.log\", env)\n",
    "if not wait_http(\"http://127.0.0.1:3000/__panel/health\", 30, panel):\n",
    "    print(open(\"/content/panel.log\").read()[-3000:]); raise RuntimeError(\"Live Panel did not start.\")\n",
    "\n",
    "CF = \"/content/cloudflared\"\n",
    "CF_SHA = \"053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0\"\n",
    "if not os.path.exists(CF):\n",
    "    urllib.request.urlretrieve(\"https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64\", CF)\n",
    "if hashlib.sha256(open(CF, \"rb\").read()).hexdigest() != CF_SHA:\n",
    "    os.remove(CF); raise RuntimeError(\"cloudflared checksum mismatch. Run this cell again.\")\n",
    "os.chmod(CF, 0o755)\n",
    "tunnel = bg(f\"{CF} tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3000\", \"/content/cloudflared.log\")\n",
    "url = \"\"\n",
    "for _ in range(60):\n",
    "    m = re.search(r\"https://[a-z0-9-]+\\.trycloudflare\\.com\", open(\"/content/cloudflared.log\").read())\n",
    "    if m: url = m.group(0); break\n",
    "    time.sleep(2)\n",
    "live = False\n",
    "if url:\n",
    "    print(\"Waiting for the link to go live…\")\n",
    "    for _ in range(36):\n",
    "        if \"Registered tunnel connection\" in open(\"/content/cloudflared.log\").read() and wait_http(url + \"/__panel/health\", 3):\n",
    "            live = True; break\n",
    "        time.sleep(5)\n",
    "\n",
    "print(\"\\n\" + \"=\" * 60)\n",
    "print(\"GPU render:\", f\"ON (--gl={GPU_GL}, Chrome for Testing)\" if env.get(\"RENDER_GL\") else \"OFF (CPU)\")\n",
    "if live:\n",
    "    print(\"🎬 Open Remotion Live Panel:\", url)\n",
    "else:\n",
    "    print(\"⚠️ Cloudflare link not ready:\", url or \"none\", \"(run the cell again)\")\n",
